<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fonbet AI Dashboard</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --accent: #00ff88;
            --border: #333333;
        }
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
            color: var(--accent);
        }
        .settings-panel {
            background-color: var(--panel-bg);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
            min-width: 250px;
        }
        input {
            background-color: #2a2a2a;
            border: 1px solid var(--border);
            color: white;
            padding: 10px;
            border-radius: 4px;
            font-size: 14px;
        }
        button {
            background-color: var(--accent);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.8;
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }
        .panel {
            background-color: var(--panel-bg);
            border-radius: 8px;
            padding: 20px;
            border: 1px solid var(--border);
            max-height: 70vh;
            overflow-y: auto;
        }
        .panel h2 {
            margin-top: 0;
            font-size: 18px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }
        .event-card {
            background-color: #2a2a2a;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .event-name {
            font-size: 14px;
            font-weight: 500;
        }
        .event-meta {
            font-size: 12px;
            color: var(--text-muted);
        }
        #ai-insights {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>FONBET // AI PREDICTOR</h1>
        <button onclick="fetchData()">Обновить данные</button>
    </div>

    <div class="settings-panel">
        <div class="input-group">
            <label>Ссылка на бэкенд Railway:</label>
            <input type="text" id="backend-url" placeholder="https://tvoy-domen.up.railway.app">
        </div>
        <div class="input-group">
            <label>Ключ Gemini API:</label>
            <input type="password" id="gemini-key" placeholder="AIzaSy...">
        </div>
    </div>

    <div class="dashboard-grid">
        <div class="panel">
            <h2>Лайв события (<span id="events-count">0</span>)</h2>
            <div id="events-container">
                <div style="color: var(--text-muted);">Введите ссылку на Railway и нажмите "Обновить данные"</div>
            </div>
        </div>

        <div class="panel">
            <h2>Анализ Gemini AI</h2>
            <button onclick="analyzeData()" style="width: 100%; margin-bottom: 15px;">Сгенерировать прогноз</button>
            <div id="ai-insights">Ожидание данных для анализа...</div>
        </div>
    </div>

    <script>
        let currentLineData = null;

        async function fetchData() {
            const baseUrl = document.getElementById('backend-url').value.trim();
            const container = document.getElementById('events-container');
            const countSpan = document.getElementById('events-count');
            
            if (!baseUrl) {
                alert('Пожалуйста, введите ссылку на ваш Railway бэкенд!');
                return;
            }

            container.innerHTML = '<div style="color: var(--accent);">Загрузка линии...</div>';

            try {
                // Добавляем /api/live-odds к ссылке Railway
                const url = baseUrl.endsWith('/') ? `${baseUrl}api/live-odds` : `${baseUrl}/api/live-odds`;
                const response = await fetch(url);
                
                if (!response.ok) throw new Error('Ошибка сети');
                
                const data = await response.json();
                
                if (data.error) {
                    container.innerHTML = `<div style="color: #ff4444;">Бэкенд сообщает: ${data.error}</div>`;
                    return;
                }

                currentLineData = data;
                renderEvents(data.events || []);
                
            } catch (error) {
                container.innerHTML = `<div style="color: #ff4444;">Ошибка: ${error.message} (Проверьте ссылку Railway)</div>`;
            }
        }

        function renderEvents(events) {
            const container = document.getElementById('events-container');
            document.getElementById('events-count').innerText = events.length;
            
            if (events.length === 0) {
                container.innerHTML = '<div style="color: var(--text-muted);">Нет активных событий</div>';
                return;
            }

            container.innerHTML = '';
            
            // Выводим первые 50 событий, чтобы не перегружать браузер
            const displayEvents = events.slice(0, 50);
            
            displayEvents.forEach(event => {
                const card = document.createElement('div');
                card.className = 'event-card';
                card.innerHTML = `
                    <div class="event-name">${event.name || 'Неизвестный матч'}</div>
                    <div class="event-meta">ID: ${event.id} | Level: ${event.level}</div>
                `;
                container.appendChild(card);
            });
            
            if (events.length > 50) {
                container.innerHTML += `<div style="text-align: center; margin-top: 10px; color: var(--text-muted);">И еще ${events.length - 50} событий скрыто...</div>`;
            }
        }

        async function analyzeData() {
            const aiContainer = document.getElementById('ai-insights');
            const apiKey = document.getElementById('gemini-key').value.trim();

            if (!currentLineData) {
                alert('Сначала загрузите линию с бэкенда!');
                return;
            }
            if (!apiKey) {
                alert('Введите ключ Gemini API!');
                return;
            }

            aiContainer.innerHTML = '<span style="color: var(--accent);">Отправка данных в Gemini...</span>';

            // Берем выжимку из первых 10 матчей для анализа (чтобы не превысить лимит токенов)
            const summaryData = currentLineData.events.slice(0, 10).map(e => e.name).join(', ');
            
            const prompt = `Проанализируй этот список текущих спортивных лайв-матчей и дай краткую стратегию для ставок (выбери 2 самых интересных на твой взгляд). Матчи: ${summaryData}`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message);
                }

                aiContainer.innerHTML = data.candidates[0].content.parts[0].text;
                
            } catch (error) {
                aiContainer.innerHTML = `<span style="color: #ff4444;">Ошибка API: ${error.message}</span>`;
            }
        }
    </script>
</body>
</html>
