<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FONBET // AI PREDICTOR PRO</title>
<style>
:root{--bg:#0f1215;--card:#181c22;--border:#2a313c;--accent:#00e676;--red:#ff3d57;--blue:#2979ff;--text:#eceff1;--muted:#8b96a5;--odd-bg:#252b34}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background:var(--bg);color:var(--text);padding:12px;max-width:900px;margin:0 auto}
.header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--card);border-radius:10px;border:1px solid var(--border);margin-bottom:12px}
.logo{font-size:18px;font-weight:800;color:var(--accent)}.logo span{color:var(--red)}
.btn-refresh{background:var(--accent);color:#000;border:none;padding:8px 14px;border-radius:6px;font-weight:700;cursor:pointer;font-size:13px}
.config-panel{display:grid;grid-template-columns:2fr 2fr 1.5fr;gap:10px;background:var(--card);padding:12px;border-radius:10px;border:1px solid var(--border);margin-bottom:12px}
@media(max-width:700px){.config-panel{grid-template-columns:1fr}}
.input-group label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.input-group input,.input-group select{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:6px;font-size:13px}
.btn-check{margin-top:6px;width:100%;background:transparent;color:var(--accent);border:1px solid var(--accent);padding:6px;border-radius:6px;font-weight:700;font-size:12px;cursor:pointer}
.key-status{font-size:11.5px;margin-top:5px;line-height:1.35;word-break:break-word}
.ok{color:var(--accent)}.bad{color:var(--red)}
.status-tabs{display:flex;gap:6px;margin-bottom:10px;background:var(--card);padding:6px;border-radius:8px;border:1px solid var(--border)}
.tab-btn{flex:1;background:transparent;color:var(--muted);border:none;padding:8px;border-radius:6px;font-size:12.5px;font-weight:700;cursor:pointer}
.tab-btn.active{background:#252b34;color:var(--text);border:1px solid var(--border)}
.tab-btn.live.active{color:var(--red)}.tab-btn.upcoming.active{color:var(--blue)}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px}
.filter-btn{background:var(--card);color:var(--muted);border:1px solid var(--border);padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.filter-btn.active{background:var(--accent);color:#000;border-color:var(--accent)}
.search-box{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:8px;margin-bottom:12px;font-size:13px}
.ai-panel{background:linear-gradient(145deg,#16202a,#191d24);border:1px solid var(--accent);border-radius:10px;padding:14px;margin-bottom:14px}
.ai-title{font-size:15px;font-weight:700;color:var(--accent);margin-bottom:8px}
.ai-content{font-size:13.5px;line-height:1.5;color:#dfe6ed;white-space:pre-wrap;word-break:break-word}
.btn-ai-all{width:100%;background:var(--accent);color:#000;border:none;padding:10px;border-radius:7px;font-weight:800;cursor:pointer;margin-top:8px;font-size:14px}
.league-header{background:#1e242d;color:var(--muted);font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:5px;margin:12px 0 6px;text-transform:uppercase}
.match-card{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:12px;margin-bottom:8px}
.match-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px}
.status-badge{padding:2px 7px;border-radius:4px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.status-live{background:rgba(255,61,87,.15);color:var(--red)}
.live-dot{width:6px;height:6px;background:var(--red);border-radius:50%;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.2}}
.status-upcoming{background:rgba(41,121,255,.15);color:var(--blue)}
.status-finished{background:rgba(139,150,165,.15);color:var(--muted)}
.teams-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.teams-names{font-size:14.5px;font-weight:700;line-height:1.35}
.score-box{background:#101418;border:1px solid var(--border);padding:5px 10px;border-radius:6px;text-align:right;min-width:65px}
.score-main{font-size:16px;font-weight:800;color:var(--accent)}.score-sub{font-size:10.5px;color:var(--muted)}
.odds-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:6px;margin-bottom:8px}
.odd-btn{background:var(--odd-bg);border:1px solid #323a46;border-radius:6px;padding:5px 7px;display:flex;justify-content:space-between;font-size:11.5px}
.odd-label{color:var(--muted)}.odd-val{color:#fff;font-weight:700}
.submarkets{font-size:11.5px;color:var(--muted);margin-bottom:8px;padding-top:6px;border-top:1px dashed var(--border)}
.submarket-item{display:inline-block;background:#13171c;padding:3px 7px;border-radius:4px;margin:2px 4px 2px 0;border:1px solid #262c36}
.btn-analyze-match{width:100%;background:rgba(0,230,118,.12);color:var(--accent);border:1px solid var(--accent);padding:7px;border-radius:6px;font-weight:700;font-size:12px;cursor:pointer}
.status-msg{color:var(--muted);font-size:13px;text-align:center;padding:20px}
</style>
</head>
<body>

<div class="header">
  <div class="logo"><span>FONBET</span> // AI PREDICTOR</div>
  <button class="btn-refresh" onclick="loadOdds()">🔄 Обновить</button>
</div>

<div class="config-panel">
  <div class="input-group">
    <label>Ссылка на бэкенд Railway:</label>
    <input type="text" id="backendUrl" value="https://fonbet-dashboard-production.up.railway.app" onchange="saveConfig()">
  </div>
  <div class="input-group">
    <label>Ключ Gemini API:</label>
    <input type="password" id="geminiKey" placeholder="AIzaSy..." onchange="saveConfig();loadModels()">
    <button class="btn-check" onclick="loadModels(true)">🔑 Проверить ключ</button>
    <div class="key-status" id="keyStatus"></div>
  </div>
  <div class="input-group">
    <label>Модель ИИ:</label>
    <select id="modelSelect" onchange="saveConfig()">
      <option value="">— сначала проверьте ключ —</option>
    </select>
  </div>
</div>

<div class="ai-panel">
  <div class="ai-title">🤖 Анализ Gemini AI</div>
  <div class="ai-content" id="aiOutput">Вставьте ключ, нажмите «Проверить ключ», выберите модель и матч.</div>
  <button class="btn-ai-all" onclick="analyzeTopLine()">🔥 Найти 3 лучшие ставки из Лайва</button>
</div>

<div class="status-tabs">
  <button class="tab-btn live active" onclick="setStatusTab('live',this)">🔴 Открытые (Лайв)</button>
  <button class="tab-btn upcoming" onclick="setStatusTab('upcoming',this)">📅 Будущие</button>
  <button class="tab-btn finished" onclick="setStatusTab('finished',this)">🏁 Закрытые</button>
</div>

<div class="filters">
  <button class="filter-btn active" onclick="setSportFilter('all',this)">Все</button>
  <button class="filter-btn" onclick="setSportFilter('футбол',this)">⚽ Футбол</button>
  <button class="filter-btn" onclick="setSportFilter('хоккей',this)">🏒 Хоккей</button>
  <button class="filter-btn" onclick="setSportFilter('теннис',this)">🎾 Теннис</button>
  <button class="filter-btn" onclick="setSportFilter('киберспорт',this)">🎮 Киберспорт</button>
</div>

<input type="text" class="search-box" id="searchInput" placeholder="🔍 Поиск матча..." oninput="renderMatches()">
<div id="matchesContainer"><div class="status-msg">Загрузка...</div></div>

<script>
let parsedMatches = [];
let matchById = {};
let currentSport = 'all';
let currentStatusTab = 'live';

const $ = id => document.getElementById(id);
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

window.onload = () => {
  const b = localStorage.getItem('fb_backend'); if (b) $('backendUrl').value = b;
  const k = localStorage.getItem('fb_gemini'); if (k) $('geminiKey').value = k;
  loadModels();
  loadOdds();
  setInterval(loadOdds, 25000);
};

function saveConfig(){
  localStorage.setItem('fb_backend', $('backendUrl').value.trim());
  localStorage.setItem('fb_gemini', $('geminiKey').value.trim());
  localStorage.setItem('fb_model', $('modelSelect').value);
}

/* ---------- Проверка ключа + список моделей ---------- */
async function loadModels(showResult){
  const key = $('geminiKey').value.trim();
  const st = $('keyStatus');
  if (!key){ st.className='key-status bad'; st.textContent='Ключ не введён'; return; }
  st.className='key-status'; st.textContent='⏳ Проверяю ключ...';
  try {
    const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200', {
      headers: { 'x-goog-api-key': key }
    });
    const d = await r.json();
    if (d.error){
      st.className='key-status bad';
      st.textContent = '❌ Ключ не подошёл: ' + d.error.message;
      return;
    }
    const models = (d.models || [])
      .filter(m => (m.supportedGenerationMethods||[]).includes('generateContent'))
      .map(m => m.name.replace('models/',''))
      .filter(n => n.startsWith('gemini') && !/embedding|tts|image|live|audio|robotics/.test(n));
    if (!models.length){
      st.className='key-status bad';
      st.textContent='⚠️ Ключ принят, но подходящих моделей нет';
      return;
    }
    // flash — вперёд (быстрее и дешевле), потом остальные
    models.sort((a,b) => (b.includes('flash')-a.includes('flash')) || b.localeCompare(a));
    const sel = $('modelSelect');
    sel.innerHTML = models.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('');
    const saved = localStorage.getItem('fb_model');
    if (saved && models.includes(saved)) sel.value = saved;
    saveConfig();
    st.className='key-status ok';
    st.textContent = `✅ Ключ рабочий. Доступно моделей: ${models.length}`;
  } catch(e){
    st.className='key-status bad';
    st.textContent = '❌ Нет связи с Google: ' + e.message + ' (попробуйте VPN)';
  }
}

/* ---------- Вкладки / фильтры ---------- */
function setStatusTab(s, btn){
  currentStatusTab = s;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active'); renderMatches();
}
function setSportFilter(s, btn){
  currentSport = s;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active'); renderMatches();
}

/* ---------- Коэффициенты ---------- */
function parseMatchOdds(arr){
  const odds = {};
  if (!arr) return odds;
  for (const f of arr){
    const id = f.f, val = f.v;
    const param = f.pt || (f.p ? (f.p/100) : '');
    if (id===921) odds['П1']=val;
    else if (id===922) odds['X']=val;
    else if (id===923) odds['П2']=val;
    else if (id===927||id===937) odds[`Ф1(${param})`]=val;
    else if (id===928||id===938) odds[`Ф2(${param})`]=val;
    else if (id===930||id===940) odds[`ТБ(${param})`]=val;
    else if (id===931||id===941) odds[`ТМ(${param})`]=val;
  }
  return odds;
}

async function loadOdds(){
  const baseUrl = $('backendUrl').value.trim().replace(/\/$/,'');
  const container = $('matchesContainer');
  try {
    const res = await fetch(`${baseUrl}/api/live-odds`);
    const data = await res.json();
    if (!data.events || !Array.isArray(data.events)){
      container.innerHTML = `<div class="status-msg">${esc(data.error || 'Загрузка линии...')}</div>`;
      return;
    }
    const sportsMap = {}; (data.sports||[]).forEach(s => sportsMap[s.id]=s);
    const miscMap = {}; (data.eventMiscs||[]).forEach(m => miscMap[m.id]=m);
    const factorsMap = {};
    (data.customFactors||[]).forEach(cf => {
      if (cf.e && Array.isArray(cf.factors)) factorsMap[cf.e] = cf.factors;
      else if (cf.e && cf.f){ (factorsMap[cf.e] = factorsMap[cf.e] || []).push(cf); }
    });
    const subEventsMap = {};
    data.events.forEach(ev => {
      if (ev.level > 1 && ev.parentId) (subEventsMap[ev.parentId] = subEventsMap[ev.parentId] || []).push(ev);
    });

    parsedMatches = []; matchById = {};
    const now = Math.floor(Date.now()/1000);

    data.events.forEach(ev => {
      if (ev.level === 1 && (ev.team1 || ev.team2)){
        const sportObj = sportsMap[ev.sportId] || {};
        const parentSportObj = sportObj.parentId ? (sportsMap[sportObj.parentId]||{}) : sportObj;
        const leagueName = sportObj.name || 'Лига';
        const rootSportName = (parentSportObj.name || leagueName).toLowerCase();
        const misc = miscMap[ev.id] || {};
        const score1 = misc.score1 !== undefined ? misc.score1 : 0;
        const score2 = misc.score2 !== undefined ? misc.score2 : 0;

        let status = 'live';
        let timeStr = misc.timerSeconds ? `${Math.floor(misc.timerSeconds/60)}'` : (misc.comment || 'LIVE');
        if (ev.beginTime && ev.beginTime > now + 60){
          status = 'upcoming';
          const d = new Date(ev.beginTime*1000);
          timeStr = d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) + ' ' + d.toLocaleDateString([], {month:'short',day:'numeric'});
        } else if (misc.isFinished || (misc.comment && misc.comment.toLowerCase().includes('заверш'))){
          status = 'finished'; timeStr = 'Завершен';
        }

        const mainOdds = parseMatchOdds(factorsMap[ev.id]);
        const subs = [];
        (subEventsMap[ev.id]||[]).forEach(sub => {
          const sm = miscMap[sub.id];
          const subScore = (sm && sm.score1 !== undefined) ? ` (${sm.score1}:${sm.score2})` : '';
          const so = Object.entries(parseMatchOdds(factorsMap[sub.id])).slice(0,2).map(([k,v]) => `${k}: ${v}`).join(' ');
          if (sub.name) subs.push(`${sub.name}${subScore}${so ? ' ['+so+']' : ''}`);
        });

        const m = {
          id: ev.id, team1: ev.team1 || 'Команда 1', team2: ev.team2 || 'Команда 2',
          league: leagueName, sportCategory: rootSportName,
          score: `${score1} : ${score2}`, timeStr, status,
          comment: misc.comment || '', odds: mainOdds, subs
        };
        parsedMatches.push(m); matchById[m.id] = m;
      }
    });
    renderMatches();
  } catch(err){
    container.innerHTML = `<div class="status-msg">Ошибка: ${esc(err.message)}</div>`;
  }
}

function renderMatches(){
  const container = $('matchesContainer');
  const q = $('searchInput').value.trim().toLowerCase();
  const filtered = parsedMatches.filter(m => {
    const okStatus = m.status === currentStatusTab;
    const okSport = currentSport==='all' || m.sportCategory.includes(currentSport) || m.league.toLowerCase().includes(currentSport);
    const okSearch = !q || m.team1.toLowerCase().includes(q) || m.team2.toLowerCase().includes(q) || m.league.toLowerCase().includes(q);
    return okStatus && okSport && okSearch;
  });
  if (!filtered.length){ container.innerHTML = `<div class="status-msg">Матчей не найдено.</div>`; return; }

  let html = `<div style="font-size:12px;color:var(--muted);margin-bottom:8px">Найдено: <b>${filtered.length}</b></div>`;
  let lastLeague = '';
  filtered.slice(0,60).forEach(m => {
    if (m.league !== lastLeague){ html += `<div class="league-header">${esc(m.league)}</div>`; lastLeague = m.league; }
    const entries = Object.entries(m.odds);
    const oddsHtml = entries.length
      ? `<div class="odds-grid">` + entries.map(([k,v]) => `<div class="odd-btn"><span class="odd-label">${esc(k)}</span><span class="odd-val">${esc(v)}</span></div>`).join('') + `</div>`
      : `<div style="font-size:11px;color:var(--muted);margin-bottom:6px">Коэффициенты закрыты</div>`;
    const badge = m.status==='live' ? `<span class="status-badge status-live"><span class="live-dot"></span> ${esc(m.timeStr)}</span>`
      : m.status==='upcoming' ? `<span class="status-badge status-upcoming">📅 ${esc(m.timeStr)}</span>`
      : `<span class="status-badge status-finished">🏁 ${esc(m.timeStr)}</span>`;
    const subsHtml = m.subs.length ? `<div class="submarkets">` + m.subs.slice(0,4).map(s => `<span class="submarket-item">${esc(s)}</span>`).join('') + `</div>` : '';
    html += `
      <div class="match-card">
        <div class="match-top">${badge}<span style="color:var(--muted)">ID: ${m.id}</span></div>
        <div class="teams-row">
          <div class="teams-names"><div>${esc(m.team1)}</div><div>${esc(m.team2)}</div></div>
          <div class="score-box"><div class="score-main">${esc(m.score)}</div><div class="score-sub">${esc(m.comment)}</div></div>
        </div>
        ${oddsHtml}${subsHtml}
        <button class="btn-analyze-match" onclick="analyzeSingleMatch(${Number(m.id)})">⚡ AI Анализ матча</button>
      </div>`;
  });
  container.innerHTML = html;
}

/* ---------- Gemini ---------- */
async function callGemini(promptText){
  const apiKey = $('geminiKey').value.trim();
  const model = $('modelSelect').value;
  const out = $('aiOutput');

  if (!apiKey){ out.textContent = '⚠️ Вставьте ключ Gemini API.'; return; }
  if (!model){ out.textContent = '⚠️ Сначала нажмите «Проверить ключ» и выберите модель.'; return; }

  out.textContent = `⏳ Отправка запроса модели ${model}...`;
  window.scrollTo({top:0, behavior:'smooth'});

  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 60000);
  try {
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'x-goog-api-key': apiKey },
      body: JSON.stringify({ contents:[{ parts:[{ text: promptText }] }] }),
      signal: controller.signal
    });
    const data = await r.json();
    if (data.error){
      out.textContent = `❌ Ошибка API (${model}): ${data.error.message}\n\nВыберите другую модель из списка или нажмите «Проверить ключ».`;
      return;
    }
    const cand = data.candidates && data.candidates[0];
    const text = cand && cand.content && cand.content.parts && cand.content.parts.map(p => p.text || '').join('');
    if (text) out.textContent = text;
    else out.textContent = '⚠️ Пустой ответ. ' + (data.promptFeedback && data.promptFeedback.blockReason ? 'Запрос заблокирован: ' + data.promptFeedback.blockReason : (cand && cand.finishReason ? 'Причина: ' + cand.finishReason : ''));
  } catch(err){
    out.textContent = err.name === 'AbortError'
      ? `⏳ Таймаут 60 секунд. Модель ${model} не ответила. Попробуйте другую модель или VPN.`
      : `❌ Ошибка сети: ${err.message}\nПроверьте интернет или VPN.`;
  } finally { clearTimeout(timer); }
}

function analyzeSingleMatch(id){
  const m = matchById[id]; if (!m) return;
  callGemini(`Проанализируй матч:\nТурнир: ${m.league}\nМатч: ${m.team1} — ${m.team2}\nСчет: ${m.score} (${m.timeStr})\nКэфы: ${JSON.stringify(m.odds)}\nДай ставку и прогноз.`);
}

function analyzeTopLine(){
  const live = parsedMatches.filter(m => m.status==='live' && Object.keys(m.odds).length > 0).slice(0,15);
  if (!live.length){ alert('Нет матчей.'); return; }
  const summary = live.map(m => `- [${m.league}] ${m.team1} vs ${m.team2} (${m.score}) кэфы: ${JSON.stringify(m.odds)}`).join('\n');
  callGemini(`Выбери топ-3 ставки из лайвов:\n${summary}`);
}
</script>
</body>
</html>
