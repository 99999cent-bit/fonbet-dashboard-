<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FONBET // AI PREDICTOR PRO</title>
<style>
:root{--bg:#0f1215;--card:#181c22;--border:#2a313c;--accent:#00e676;--red:#ff3d57;--blue:#2979ff;--text:#eceff1;--muted:#8b96a5;--odd-bg:#252b34}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background:var(--bg);color:var(--text);padding:12px;max-width:900px;margin:0 auto}
.header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--card);border-radius:10px;border:1px solid var(--border);margin-bottom:8px}
.logo{font-size:18px;font-weight:800;color:var(--accent)}.logo span{color:var(--red)}
.btn-refresh{background:var(--accent);color:#000;border:none;padding:8px 14px;border-radius:6px;font-weight:700;cursor:pointer;font-size:13px}
.sync{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--muted);background:var(--card);border:1px solid var(--border);border-radius:8px;padding:7px 10px;margin-bottom:10px}
.sync select,.sync button{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:5px;padding:3px 7px;font-size:12px;cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.ok{background:var(--accent);animation:blink 2s infinite}.dot.err{background:var(--red)}.dot.paused{background:#ffb300}
.config-panel{display:grid;grid-template-columns:2fr 2fr 1.5fr;gap:10px;background:var(--card);padding:12px;border-radius:10px;border:1px solid var(--border);margin-bottom:12px}
@media(max-width:700px){.config-panel{grid-template-columns:1fr}}
.input-group label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.input-group input,.input-group select{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:6px;font-size:13px}
.btn-check{margin-top:6px;width:100%;background:transparent;color:var(--accent);border:1px solid var(--accent);padding:6px;border-radius:6px;font-weight:700;font-size:12px;cursor:pointer}
.key-status{font-size:11.5px;margin-top:5px;line-height:1.35;word-break:break-word}
.ok{color:var(--accent)}.bad{color:var(--red)}
.ai-panel{background:linear-gradient(145deg,#16202a,#191d24);border:1px solid var(--accent);border-radius:10px;padding:14px;margin-bottom:12px}
.ai-title{font-size:15px;font-weight:700;color:var(--accent);margin-bottom:8px}
.ai-content{font-size:13.5px;line-height:1.5;color:#dfe6ed;white-space:pre-wrap;word-break:break-word}
.btn-ai-all{width:100%;background:var(--accent);color:#000;border:none;padding:10px;border-radius:7px;font-weight:800;cursor:pointer;margin-top:8px;font-size:14px}
.feed{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:10px;font-size:12px;line-height:1.6}
.feed b{color:var(--accent)}.feed .t{color:var(--muted)}
.status-tabs{display:flex;gap:6px;margin-bottom:10px;background:var(--card);padding:6px;border-radius:8px;border:1px solid var(--border)}
.tab-btn{flex:1;background:transparent;color:var(--muted);border:none;padding:8px 4px;border-radius:6px;font-size:12.5px;font-weight:700;cursor:pointer}
.tab-btn.active{background:#252b34;color:var(--text);border:1px solid var(--border)}
.tab-btn.live.active{color:var(--red)}.tab-btn.upcoming.active{color:var(--blue)}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px}
.filter-btn{background:var(--card);color:var(--muted);border:1px solid var(--border);padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.filter-btn.active{background:var(--accent);color:#000;border-color:var(--accent)}
.search-box{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:8px;margin-bottom:12px;font-size:13px}
.league-header{background:#1e242d;color:var(--muted);font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:5px;margin:12px 0 6px;text-transform:uppercase}
.match-card{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:12px;margin-bottom:8px}
.match-head{cursor:pointer}
.match-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px;color:var(--muted)}
.status-badge{padding:2px 7px;border-radius:4px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.status-live{background:rgba(255,61,87,.15);color:var(--red)}
.live-dot{width:6px;height:6px;background:var(--red);border-radius:50%;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.status-upcoming{background:rgba(41,121,255,.15);color:var(--blue)}
.status-finished{background:rgba(139,150,165,.15);color:var(--muted)}
.teams-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.teams-names{font-size:14.5px;font-weight:700;line-height:1.35}
.score-box{background:#101418;border:1px solid var(--border);padding:5px 10px;border-radius:6px;text-align:right;min-width:65px}
.score-main{font-size:16px;font-weight:800;color:var(--accent)}.score-sub{font-size:10.5px;color:var(--muted)}
.score-box.changed{animation:goal 3s ease-out;border-color:var(--accent)}
@keyframes goal{0%{background:rgba(0,230,118,.55);transform:scale(1.1)}100%{background:#101418;transform:scale(1)}}
.odds-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:6px;margin-bottom:8px}
.odd-btn{background:var(--odd-bg);border:1px solid #323a46;border-radius:6px;padding:5px 7px;display:flex;justify-content:space-between;font-size:11.5px;gap:4px}
.odd-label{color:var(--muted)}.odd-val{color:#fff;font-weight:700;white-space:nowrap}
.odd-btn.up{animation:up 3s ease-out}.odd-btn.down{animation:down 3s ease-out}
.odd-btn.up .odd-val{color:var(--accent)}.odd-btn.down .odd-val{color:var(--red)}
@keyframes up{0%{background:rgba(0,230,118,.5)}100%{background:var(--odd-bg)}}
@keyframes down{0%{background:rgba(255,61,87,.5)}100%{background:var(--odd-bg)}}
.hint{font-size:11px;color:var(--muted);text-align:center;margin-bottom:6px}
.details{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);font-size:12.5px}
.details.open{display:block}
.d-sec{margin-bottom:12px}
.d-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:5px}
.d-meta{display:grid;grid-template-columns:auto 1fr;gap:3px 12px}
.d-meta span:nth-child(odd){color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{background:#13171c;border:1px solid #262c36;border-radius:5px;padding:3px 7px;font-size:11.5px}
.chip b{color:#fff}.chip.up b{color:var(--accent)}.chip.down b{color:var(--red)}
.sub-block{margin-bottom:8px}.sub-name{font-weight:700;margin-bottom:3px}
.log{font-size:12px;line-height:1.6;color:#cfd8dc}.log .t{color:var(--muted)}
.btn-analyze-match{width:100%;background:rgba(0,230,118,.12);color:var(--accent);border:1px solid var(--accent);padding:8px;border-radius:6px;font-weight:700;font-size:12px;cursor:pointer}
.btn-more{width:100%;background:var(--card);color:var(--text);border:1px solid var(--border);padding:10px;border-radius:8px;font-weight:700;cursor:pointer;margin-top:6px}
.status-msg{color:var(--muted);font-size:13px;text-align:center;padding:20px}
details.diag{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-top:14px;font-size:12px;color:var(--muted)}
details.diag pre{white-space:pre-wrap;word-break:break-all;margin-top:6px;color:#cfd8dc;font-size:11.5px}
.sport-head{display:flex;justify-content:space-between;align-items:center;background:#1e242d;border:1px solid var(--border);border-radius:8px;padding:11px 12px;margin-top:8px;cursor:pointer;font-weight:700;font-size:14px}
.sport-head .cnt{color:var(--muted);font-weight:600;font-size:12px}
.league-head{display:flex;justify-content:space-between;cursor:pointer}
.top-sec{font-size:13px;font-weight:800;margin:14px 0 6px;color:var(--accent)}
.lg-tag{font-size:10.5px;color:var(--muted);margin-bottom:6px}
.tab-btn.top.active{color:#ffb300}
.status-tabs{overflow-x:auto}.tab-btn{white-space:nowrap;padding:8px 10px}
.mk{margin-bottom:8px;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.mk-head{display:flex;justify-content:space-between;background:#1e242d;padding:9px 10px;font-weight:700;font-size:12.5px;cursor:pointer}
.mk-body{padding:8px;display:grid;gap:6px}.mk-body.shut{display:none}
.mk-row3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mk-row2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mk-tot{display:grid;grid-template-columns:46px 1fr 1fr;gap:6px;align-items:center}
.mk-tot .par{color:var(--muted);font-weight:700;text-align:center;font-size:12px}
.mk-sub{font-size:11px;color:var(--muted);margin:2px 0 0}
.mk .odd-btn{font-size:12.5px;padding:8px}
.ai-box{background:#13171c;border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:10px}
.ai-legend{font-size:11px;color:var(--muted);margin-bottom:6px}
.ai-sum{font-size:13px;line-height:1.45;margin-bottom:8px}
.bet{border-left:4px solid;border-radius:6px;padding:8px 10px;margin-bottom:6px}
.bet.low{border-color:var(--accent);background:rgba(0,230,118,.10)}
.bet.medium{border-color:#ffb300;background:rgba(255,179,0,.10)}
.bet.high{border-color:var(--red);background:rgba(255,61,87,.10)}
.bet-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px}
.bet-odd{color:var(--muted);font-size:12px}.bet-risk{margin-left:auto;font-size:11px;font-weight:700}
.bet.low .bet-risk{color:var(--accent)}.bet.medium .bet-risk{color:#ffb300}.bet.high .bet-risk{color:var(--red)}
.bet-why{font-size:12.5px;color:#cfd8dc;margin-top:4px;line-height:1.4}
.ai-foot{font-size:11px;color:var(--muted);margin:6px 0}
.odd-btn.pick-low{outline:2px solid var(--accent)}.odd-btn.pick-medium{outline:2px solid #ffb300}.odd-btn.pick-high{outline:2px solid var(--red)}
.btn-analyze-match{margin-top:2px}.btn-analyze-match:disabled{opacity:.6}
</style>
</head>
<body>

<div class="header">
  <div class="logo"><span>FONBET</span> // AI PREDICTOR</div>
  <button class="btn-refresh" id="btnRefresh">🔄 Обновить</button>
</div>

<div class="sync">
  <span class="dot" id="syncDot"></span>
  <span id="syncText">Ожидание данных...</span>
  <span style="margin-left:auto">Авто:</span>
  <select id="intervalSelect">
    <option value="5">5 с</option><option value="10" selected>10 с</option>
    <option value="15">15 с</option><option value="30">30 с</option><option value="60">60 с</option>
  </select>
  <button id="btnPause">⏸ Пауза</button>
</div>

<div class="config-panel">
  <div class="input-group">
    <label>Ссылка на бэкенд Railway:</label>
    <input type="text" id="backendUrl" value="https://fonbet-dashboard-production.up.railway.app">
  </div>
  <div class="input-group">
    <label>Ключ Gemini API:</label>
    <input type="password" id="geminiKey" placeholder="AIzaSy...">
    <button class="btn-check" id="btnCheckKey">🔑 Проверить ключ</button>
    <div class="key-status" id="keyStatus"></div>
  </div>
  <div class="input-group">
    <label>Модель ИИ:</label>
    <select id="modelSelect"><option value="">— сначала проверьте ключ —</option></select>
  </div>
</div>

<div class="ai-panel">
  <div class="ai-title">🤖 Анализ Gemini AI</div>
  <div class="ai-content" id="aiOutput">Вставьте ключ, нажмите «Проверить ключ», выберите модель. Нажмите на матч, чтобы увидеть подробности.</div>
  <button class="btn-ai-all" id="btnTop">🔥 Найти 3 лучшие ставки из Лайва</button>
</div>

<div class="feed" id="feed" style="display:none"></div>

<div class="status-tabs">
  <button class="tab-btn top active" data-tab="top">🔥 Топ</button>
  <button class="tab-btn live" data-tab="live">🔴 Лайв</button>
  <button class="tab-btn upcoming" data-tab="upcoming">📅 Будущие</button>
  <button class="tab-btn finished" data-tab="finished">🏁 Закрытые</button>
</div>

<div class="filters" id="sportBar"></div>
<input type="text" class="search-box" id="searchInput" placeholder="🔍 Поиск матча...">
<div id="matchesContainer"><div class="status-msg">Загрузка...</div></div>

<details class="diag"><summary>🛠 Диагностика данных</summary><pre id="diagOut">Пока нет данных.</pre></details>

<script>
/* ================= Состояние ================= */
let parsedMatches = [], matchById = {};
let prevState = {}, matchLog = {};
const finishedStore = new Map();
let feedItems = [];
const expanded = new Set();
let currentSport = 'all', currentStatusTab = 'top', visibleLimit = 60;
const openSports = new Set(), closedLeagues = new Set(), sportLimit = {};
let sportsTouched = false, lastAutoOpen = null;
const toggledMk = new Set(), aiResults = {};
let currentPicks = {};
let paused = false, loading = false, nextAt = 0, pollTimer = null, lastOkAt = 0, lastErr = '';

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const clock = (t = Date.now()) => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };

/* ================= Инициализация ================= */
window.addEventListener('load', () => {
  const b = localStorage.getItem('fb_backend'); if (b) $('backendUrl').value = b;
  const k = localStorage.getItem('fb_gemini'); if (k) $('geminiKey').value = k;
  const iv = localStorage.getItem('fb_interval'); if (iv) $('intervalSelect').value = iv;

  $('backendUrl').addEventListener('change', saveConfig);
  $('geminiKey').addEventListener('change', () => { saveConfig(); loadModels(); });
  $('modelSelect').addEventListener('change', saveConfig);
  $('btnCheckKey').addEventListener('click', () => loadModels(true));
  $('btnRefresh').addEventListener('click', () => loadOdds());
  $('btnTop').addEventListener('click', analyzeTopLine);
  $('searchInput').addEventListener('input', () => { visibleLimit = 60; renderMatches(); });
  $('intervalSelect').addEventListener('change', () => { saveConfig(); scheduleNext(); });
  $('btnPause').addEventListener('click', togglePause);

  document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', () => {
    currentStatusTab = btn.dataset.tab; visibleLimit = 60;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active'); renderMatches();
  }));
  document.querySelectorAll('.filter-btn').forEach(btn => btn.addEventListener('click', () => {
    currentSport = btn.dataset.sport; visibleLimit = 60;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active'); renderMatches();
  }));
  $('matchesContainer').addEventListener('click', onContainerClick);
  $('sportBar').addEventListener('click', e => {
    const b = e.target.closest('[data-sport]'); if (!b) return;
    currentSport = b.dataset.sport; renderMatches();
  });

  document.addEventListener('visibilitychange', () => { if (!document.hidden && !paused) loadOdds(); });
  setInterval(tick, 1000);

  loadModels();
  loadOdds();
});

function saveConfig(){
  localStorage.setItem('fb_backend', $('backendUrl').value.trim());
  localStorage.setItem('fb_gemini', $('geminiKey').value.trim());
  localStorage.setItem('fb_model', $('modelSelect').value);
  localStorage.setItem('fb_interval', $('intervalSelect').value);
}

function togglePause(){
  paused = !paused;
  $('btnPause').textContent = paused ? '▶ Продолжить' : '⏸ Пауза';
  if (paused) clearTimeout(pollTimer); else loadOdds();
  setSync();
}

function scheduleNext(){
  clearTimeout(pollTimer);
  if (paused) { setSync(); return; }
  const sec = parseInt($('intervalSelect').value, 10) || 10;
  nextAt = Date.now() + sec * 1000;
  pollTimer = setTimeout(() => { if (document.hidden) { scheduleNext(); } else loadOdds(); }, sec * 1000);
  setSync();
}

function setSync(){
  const dot = $('syncDot'), txt = $('syncText');
  if (paused){ dot.className = 'dot paused'; txt.textContent = 'Пауза' + (lastOkAt ? ` · данные от ${clock(lastOkAt)}` : ''); return; }
  if (lastErr){ dot.className = 'dot err'; txt.textContent = `Ошибка: ${lastErr}` + (lastOkAt ? ` · последние данные ${clock(lastOkAt)}` : ''); return; }
  if (!lastOkAt){ dot.className = 'dot'; txt.textContent = loading ? 'Загрузка...' : 'Ожидание данных...'; return; }
  const left = Math.max(0, Math.round((nextAt - Date.now()) / 1000));
  dot.className = 'dot ok';
  txt.textContent = `Обновлено ${clock(lastOkAt)} · следующее через ${left} с`;
}

/* ================= Парсинг данных ================= */
const KNOWN = { 921:'П1', 922:'X', 923:'П2' };
function factorLabel(id, param){
  if (KNOWN[id]) return KNOWN[id];
  if (id===927||id===937) return `Ф1(${param})`;
  if (id===928||id===938) return `Ф2(${param})`;
  if (id===930||id===940) return `ТБ(${param})`;
  if (id===931||id===941) return `ТМ(${param})`;
  return null;
}
function parseFactors(arr){
  const main = {}, extra = [];
  if (!arr) return { main, extra };
  for (const f of arr){
    const param = f.pt || (f.p ? (f.p / 100) : '');
    const label = factorLabel(f.f, param);
    if (label) main[label] = f.v;
    else extra.push({ label: `#${f.f}${param !== '' ? ' ('+param+')' : ''}`, v: f.v });
  }
  return { main, extra };
}

/* Статус: поддерживаем разные названия полей, т.к. формат бэкенда не гарантирован */
function detectStatus(ev, misc, nowSec){
  const start = Number(ev.startTime ?? ev.beginTime ?? 0) || 0;
  const place = String(ev.place || '').toLowerCase();
  const comment = String(misc.comment || '').toLowerCase();
  if (misc.isFinished || /заверш|окончен|finished/.test(comment)) return { status:'finished', start };
  if (place === 'live') return { status:'live', start };
  if (place === 'line') return { status:'upcoming', start };
  if (misc.__has) return { status:'live', start };   // есть живые данные (счёт/таймер)
  return { status:'upcoming', start };
}

function buildMatches(data){
  const sportsMap = {}; (data.sports || []).forEach(s => sportsMap[s.id] = s);
  const miscMap = {}; (data.eventMiscs || []).forEach(m => miscMap[m.id] = m);
  const factorsMap = {};
  (data.customFactors || []).forEach(cf => {
    if (cf.e && Array.isArray(cf.factors)) factorsMap[cf.e] = cf.factors;
    else if (cf.e && cf.f !== undefined){ (factorsMap[cf.e] = factorsMap[cf.e] || []).push(cf); }
  });
  const subEventsMap = {};
  data.events.forEach(ev => { if (ev.level > 1 && ev.parentId) (subEventsMap[ev.parentId] = subEventsMap[ev.parentId] || []).push(ev); });

  const fresh = [], nowSec = Math.floor(Date.now() / 1000), fetchedAt = Date.now();

  data.events.forEach(ev => {
    if (!(ev.level === 1 && (ev.team1 || ev.team2))) return;
    const sportObj = sportsMap[ev.sportId] || {};
    let rootObj = sportObj, guard = 0;
    while (rootObj.parentId && sportsMap[rootObj.parentId] && guard++ < 6) rootObj = sportsMap[rootObj.parentId];
    const league = sportObj.name || 'Лига';
    const grp = sportGroup(rootObj.name || '', league);
    const sportName = grp.name;

    const rawMisc = miscMap[ev.id];
    const misc = rawMisc ? Object.assign({ __has: true }, rawMisc) : {};
    const { status, start } = detectStatus(ev, misc, nowSec);

    const s1 = misc.score1 !== undefined ? misc.score1 : 0;
    const s2 = misc.score2 !== undefined ? misc.score2 : 0;
    const pf = parseFactors(factorsMap[ev.id]);

    const subs = [];
    (subEventsMap[ev.id] || []).forEach(sub => {
      if (!sub.name) return;
      const sm = miscMap[sub.id];
      const sp = parseFactors(factorsMap[sub.id]);
      subs.push({ id: sub.id, name: sub.name, score: (sm && sm.score1 !== undefined) ? `${sm.score1}:${sm.score2}` : '', odds: sp.main, extra: sp.extra });
    });

    fresh.push({
      idx: fresh.length, sortOrder: String(ev.sortOrder || ''), id: ev.id, team1: ev.team1 || 'Команда 1', team2: ev.team2 || 'Команда 2',
      league, sport: sportName, sportKey: grp.key, sportIcon: grp.icon, sportCategory: sportName.toLowerCase(), tier: leagueTier(league),
      status, start, place: ev.place || '',
      score: `${s1} : ${s2}`, comment: misc.comment || '',
      timerSeconds: misc.timerSeconds ?? null, timerDir: misc.timerDirection ?? 1, timerAt: fetchedAt,
      odds: pf.main, extra: pf.extra, subs, oddsDir: {}, scoreChanged: false
    });
  });
  return fresh;
}

/* ================= Виды спорта и «Топ» ================= */
const SPORTS = [
  ['football','Футбол','⚽',/футбол|football|soccer/],
  ['hockey','Хоккей','🏒',/хоккей|hockey/],
  ['tennis','Теннис','🎾',/^(?!.*настольн).*теннис|tennis/],
  ['basket','Баскетбол','🏀',/баскетбол|basket/],
  ['esports','Киберспорт','🎮',/киберспорт|cs2|cs:go|dota|valorant|league of legends|esport/],
  ['tt','Настольный теннис','🏓',/настольн/],
  ['volley','Волейбол','🏐',/волейбол/],
  ['mma','Единоборства','🥊',/бокс|mma|ufc|единоборств/],
  ['baseball','Бейсбол','⚾',/бейсбол/],
  ['handball','Гандбол','🤾',/гандбол/],
  ['rugby','Регби','🏉',/регби/]
];
function sportGroup(root, league){
  const r = root.toLowerCase(), l = league.toLowerCase();
  for (const s of SPORTS) if (s[3].test(r)) return { key:s[0], name:s[1], icon:s[2] };
  for (const s of SPORTS) if (s[3].test(l)) return { key:s[0], name:s[1], icon:s[2] };
  const nm = (root && root !== league) ? root : 'Другое';
  return { key:'x:' + nm.toLowerCase(), name:nm, icon:'🏅' };
}
/* Топ-турниры (правьте списки под себя). tier: 2 — главные, 1 — крупные, 0 — обычные, -1 — виртуальные */
const T1 = /лига чемпионов|лига европы|лига конференций|лига наций|чемпионат мира|чемпионат европы|кубок мира|премьер-лига англии|англия.*премьер|ла лига|испания.*примера|серия а|бундеслига|лига 1|кхл|нхл|нба|nba|евролига|atp|wta|уимблдон|ролан гаррос|australian open|us open|ufc|мейджор|major|iem|blast|esl pro/;
const T2 = /сборн|товарищеск|премьер-лига|рпл|эредивизи|примейра|чемпионшип/;
function leagueTier(l){
  const s = String(l).toLowerCase();
  if (/виртуал|virtual|симуляц/.test(s)) return -1;
  if (T1.test(s)) return 2;
  if (T2.test(s)) return 1;
  return 0;
}
function topScore(m){
  const soon = m.status === 'upcoming' && m.start && (m.start * 1000 - Date.now()) < 3 * 3600e3 ? 15 : 0;
  return m.tier * 100 + Math.min(20, Object.keys(m.odds).length + m.subs.length * 2) + (m.status === 'live' ? 30 : 0) + soon;
}

/* ================= Загрузка и обнаружение изменений ================= */
async function loadOdds(){
  if (loading) return;
  loading = true; clearTimeout(pollTimer); setSync();
  const baseUrl = $('backendUrl').value.trim().replace(/\/$/, '');
  const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), 15000);
  try {
    const res = await fetch(`${baseUrl}/api/live-odds`, { signal: ctrl.signal, cache: 'no-store' });
    const data = await res.json();
    if (!data.events || !Array.isArray(data.events)) throw new Error(data.error || 'Бэкенд ещё грузит линию');
    processData(data);
    lastOkAt = Date.now(); lastErr = '';
  } catch (err) {
    lastErr = err.name === 'AbortError' ? 'таймаут 15 с' : err.message;
    if (!parsedMatches.length) $('matchesContainer').innerHTML = `<div class="status-msg">Ошибка: ${esc(lastErr)}</div>`;
  } finally {
    clearTimeout(to); loading = false; scheduleNext();
  }
}

function addLog(id, text){ (matchLog[id] = matchLog[id] || []).push({ t: Date.now(), text }); if (matchLog[id].length > 40) matchLog[id].shift(); }
function pushFeed(m, oldScore){
  feedItems.unshift({ t: Date.now(), text: `${m.team1} — ${m.team2}: ${oldScore} → ${m.score}` });
  feedItems = feedItems.slice(0, 8); renderFeed();
}

function processData(data){
  const fresh = buildMatches(data);
  const firstLoad = Object.keys(prevState).length === 0;

  fresh.forEach(m => {
    const p = prevState[m.id];
    if (p && !firstLoad){
      if (p.score !== m.score){
        m.scoreChanged = true; addLog(m.id, `Счёт ${p.score} → ${m.score}`);
        if (m.status === 'live') pushFeed(m, p.score);
      }
      for (const k in m.odds){
        if (p.odds[k] !== undefined && Number(p.odds[k]) !== Number(m.odds[k])) m.oddsDir[k] = Number(m.odds[k]) > Number(p.odds[k]) ? 'up' : 'down';
      }
      if (p.status !== m.status) addLog(m.id, `Статус: ${p.status} → ${m.status}`);
    }
    prevState[m.id] = { score: m.score, odds: Object.assign({}, m.odds), status: m.status };
  });

  /* Матчи, исчезнувшие из ленты лайва, считаем закрытыми (защита от сбоя ленты: порог 50%) */
  const prevReal = parsedMatches.filter(m => !m.synthetic);
  const freshIds = new Set(fresh.map(m => m.id));
  if (prevReal.length && fresh.length >= prevReal.length * 0.5){
    prevReal.forEach(m => {
      if (m.status === 'live' && !freshIds.has(m.id)){
        finishedStore.set(m.id, Object.assign({}, m, { status:'finished', synthetic:true, finishedAt: Date.now(), scoreChanged:false, oddsDir:{} }));
        addLog(m.id, 'Матч пропал из лайва → завершён');
      }
    });
  }
  fresh.forEach(m => finishedStore.delete(m.id));
  while (finishedStore.size > 150) finishedStore.delete(finishedStore.keys().next().value);

  parsedMatches = fresh.concat([...finishedStore.values()]);
  matchById = {}; parsedMatches.forEach(m => matchById[m.id] = m);
  updateDiag(data, fresh);
  renderMatches();
}

function updateDiag(data, fresh){
  const byPlace = {}, byStatus = { live:0, upcoming:0, finished:0 };
  (data.events || []).forEach(e => { if (e.level === 1) { const k = e.place || '(нет поля place)'; byPlace[k] = (byPlace[k] || 0) + 1; } });
  fresh.forEach(m => byStatus[m.status]++);
  const ev1 = (data.events || []).find(e => e.level === 1) || {};
  const out = [
    `Ключи ответа: ${Object.keys(data).join(', ')}`,
    `Событий всего: ${data.events.length}, матчей (level 1): ${fresh.length}`,
    `Поле place: ${JSON.stringify(byPlace)}`,
    `eventMiscs: ${(data.eventMiscs || []).length}`,
    `Определено: live=${byStatus.live}, upcoming=${byStatus.upcoming}, finished(из ленты)=${byStatus.finished}`,
    `Закрытые из памяти сессии: ${finishedStore.size}`,
    `Поля события: ${Object.keys(ev1).join(', ')}`,
    `Поля eventMisc: ${Object.keys((data.eventMiscs || [])[0] || {}).join(', ')}`
  ];
  $('diagOut').textContent = out.join('\n');
}

function renderFeed(){

function fmtTimer(m, full){
  if (m.timerSeconds === null || m.timerSeconds === undefined) return m.comment || 'LIVE';
  const el = (Date.now() - m.timerAt) / 1000;
  let s = m.timerSeconds + (m.timerDir === 1 ? el : m.timerDir === 2 ? -el : 0);
  s = Math.max(0, s);
  return full ? `${pad(Math.floor(s/60))}:${pad(Math.floor(s%60))}` : `${Math.floor(s/60)}'`;
}

function fmtStart(m){
  if (!m.start) return 'время неизвестно';
  const d = new Date(m.start * 1000);
  const diffMin = Math.round((m.start * 1000 - Date.now()) / 60000);
  let rel = '';
  if (diffMin > 0) rel = diffMin >= 60 ? ` (через ${Math.floor(diffMin/60)} ч ${diffMin%60} мин)` : ` (через ${diffMin} мин)`;
  else rel = ' (скоро начнётся)';
  return d.toLocaleDateString([], { day:'numeric', month:'short' }) + ' ' + d.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' }) + rel;
}

const chip = (label, val, dir) => `<span class="chip ${dir || ''}"><span style="color:var(--muted)">${esc(label)}</span> <b>${esc(val)}${dir === 'up' ? ' ▲' : dir === 'down' ? ' ▼' : ''}</b></span>`;

function passFilters(m, q){

function topList(arr){

function renderTop(base){
  const mk = m => Object.keys(m.odds).length;
  const ok = m => m.tier >= 0 && mk(m) > 0 && (m.tier >= 1 || mk(m) >= 10);
  const live = base.filter(m => m.status === 'live' && ok(m)).sort((a, b) => topScore(b) - topScore(a)).slice(0, 20).sort((a, b) => a.idx - b.idx);
  const nowS = Date.now() / 1000;
  const soon = base.filter(m => m.status === 'upcoming' && ok(m) && (!m.start || m.start - nowS < 86400))
    .sort((a, b) => topScore(b) - topScore(a)).slice(0, 20).sort((a, b) => a.idx - b.idx);
  if (!live.length && !soon.length) return `<div class="status-msg">Топ-матчей сейчас нет. Загляните во вкладки «Лайв» и «Будущие».</div>`;
  let h = '';
  if (live.length) h += `<div class="top-sec">🔴 Топ — сейчас играют (${live.length})</div>` + topList(live);
  if (soon.length) h += `<div class="top-sec">📅 Топ — ближайшие 24 часа (${soon.length})</div>` + topList(soon);
  return h;
}

function passSearch(m, q){
  return !q || m.team1.toLowerCase().includes(q) || m.team2.toLowerCase().includes(q) || m.league.toLowerCase().includes(q);
}
function topOk(m){ const n = Object.keys(m.odds).length; return m.tier >= 0 && n > 0 && (m.tier >= 1 || n >= 10); }
function isTopCandidate(m){
  return topOk(m) && ((m.status === 'live') || (m.status === 'upcoming' && (!m.start || m.start - Date.now() / 1000 < 86400)));
}
function renderSportBar(inSearch){
  const bar = $('sportBar'), sl = bar.scrollLeft;
  const tabFn = currentStatusTab === 'top' ? isTopCandidate : (m => m.status === currentStatusTab);
  const cnt = {}, meta = {}; let total = 0;
  parsedMatches.forEach(m => { meta[m.sportKey] = { name:m.sport, icon:m.sportIcon }; });
  inSearch.filter(tabFn).forEach(m => { cnt[m.sportKey] = (cnt[m.sportKey] || 0) + 1; total++; });
  const order = SPORTS.map(x => x[0]);
  const keys = Object.keys(meta).filter(k => cnt[k] || k === currentSport).sort((a, b) => {
    const ia = order.indexOf(a), ib = order.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || (cnt[b] || 0) - (cnt[a] || 0);
  });
  bar.innerHTML = `<button class="filter-btn ${currentSport === 'all' ? 'active' : ''}" data-sport="all">Все (${total})</button>` +
    keys.map(k => `<button class="filter-btn ${k === currentSport ? 'active' : ''}" data-sport="${esc(k)}">${meta[k].icon} ${esc(meta[k].name)} (${cnt[k] || 0})</button>`).join('');
  bar.scrollLeft = sl;
}

function renderMatches(){
  const container = $('matchesContainer');
  const q = $('searchInput').value.trim().toLowerCase();
  const inSearch = parsedMatches.filter(m => passSearch(m, q));
  const base = inSearch.filter(m => currentSport === 'all' || m.sportKey === currentSport);
  renderSportBar(inSearch);
  const counts = { live:0, upcoming:0, finished:0 };
  base.forEach(m => counts[m.status]++);
  document.querySelector('.tab-btn.live').textContent = `🔴 Лайв (${counts.live})`;
  document.querySelector('.tab-btn.upcoming').textContent = `📅 Будущие (${counts.upcoming})`;
  document.querySelector('.tab-btn.finished').textContent = `🏁 Закрытые (${counts.finished})`;

  if (currentStatusTab === 'top'){ container.innerHTML = renderTop(base); return; }

  let list = base.filter(m => m.status === currentStatusTab);
  if (currentStatusTab === 'upcoming') list = list.slice().sort((a, b) => (a.start || 9e12) - (b.start || 9e12));
  if (currentStatusTab === 'finished') list = list.slice().sort((a, b) => (b.finishedAt || 0) - (a.finishedAt || 0));
  if (!list.length){
    container.innerHTML = `<div class="status-msg">${currentStatusTab === 'finished' ? 'Закрытых матчей пока нет. Здесь появятся матчи, которые закончились, пока страница была открыта.' : 'Матчей не найдено.'}</div>`;
    return;
  }

  const sports = new Map();
  list.forEach(m => {
    let sp = sports.get(m.sportKey);
    if (!sp){ sp = { key:m.sportKey, name:m.sport, icon:m.sportIcon, leagues:new Map(), count:0 }; sports.set(m.sportKey, sp); }
    sp.count++;
    let lg = sp.leagues.get(m.league);
    if (!lg){ lg = { name:m.league, tier:m.tier, items:[], minIdx:Infinity }; sp.leagues.set(m.league, lg); }
    lg.items.push(m); lg.minIdx = Math.min(lg.minIdx, m.idx);
  });
  const order = SPORTS.map(x => x[0]);
  const arr = [...sports.values()].sort((a, b) => {
    const ia = order.indexOf(a.key), ib = order.indexOf(b.key);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || b.count - a.count;
  });
  lastAutoOpen = arr[0].key;

  let html = `<div class="hint">Нажмите на вид спорта, чтобы открыть список. Нажмите на матч — подробности.</div>`;
  arr.forEach(sp => {
    const single = currentSport !== 'all';
    const isOpen = single || q ? true : (sportsTouched ? openSports.has(sp.key) : sp.key === lastAutoOpen);
    if (!single) html += `<div class="sport-head" data-sport="${esc(sp.key)}"><span>${sp.icon} ${esc(sp.name)}</span><span class="cnt">${sp.count} ${isOpen ? '▾' : '▸'}</span></div>`;
    if (!isOpen) return;
    const lim = sportLimit[sp.key] || 40;
    let shown = 0, more = false;
    const leagues = [...sp.leagues.values()].sort((a, b) => a.minIdx - b.minIdx);
    for (const lg of leagues){
      if (shown >= lim){ more = true; break; }
      const lgKey = sp.key + '|' + lg.name, closed = closedLeagues.has(lgKey);
      html += `<div class="league-header league-head" data-lg="${esc(lgKey)}"><span>${lg.tier >= 2 ? '⭐ ' : ''}${esc(lg.name)}</span><span>${lg.items.length} ${closed ? '▸' : '▾'}</span></div>`;
      if (closed) continue;
      for (const m of lg.items){ if (shown >= lim){ more = true; break; } html += cardHtml(m, false); shown++; }
    }
    if (more) html += `<button class="btn-more" data-act="more" data-sport="${esc(sp.key)}">Показать ещё в «${esc(sp.name)}»</button>`;
  });
  container.innerHTML = html;
}

const nParam = p => { const n = parseFloat(String(p).replace(',', '.')); return isNaN(n) ? null : n; };
const oddCell = (label, val, dir) => `<div class="odd-btn ${dir || ''} ${currentPicks[label] ? 'pick-' + currentPicks[label] : ''}"><span class="odd-label">${esc(label)}</span><span class="odd-val">${esc(val)}${dir === 'up' ? ' ▲' : dir === 'down' ? ' ▼' : ''}</span></div>`;

/* Разбираем коэффициенты в таблицы: Исход / Фора / Тотал */
function marketTables(odds, dirs){
  dirs = dirs || {}; const out = [];
  const res = ['П1', 'X', 'П2'].filter(k => odds[k] !== undefined);
  if (res.length) out.push({ title:'Исход', html:`<div class="mk-row3">${res.map(k => oddCell(k, odds[k], dirs[k])).join('')}</div>` });

  const f1 = [], f2 = [], tot = {};
  Object.keys(odds).forEach(k => {
    const mm = k.match(/^(Ф1|Ф2|ТБ|ТМ)\((.*)\)$/); if (!mm) return;
    const o = { k, p: nParam(mm[2]), raw: mm[2] };
    if (mm[1] === 'Ф1') f1.push(o); else if (mm[1] === 'Ф2') f2.push(o);
    else { const key = mm[2]; (tot[key] = tot[key] || { n: nParam(key) })[mm[1]] = k; }
  });
  if (f1.length || f2.length){
    const used = new Set(), rows = [];
    f1.sort((x, y) => (x.p ?? 0) - (y.p ?? 0)).forEach(x => {
      const y = f2.find(z => z.p !== null && x.p !== null && z.p === -x.p && !used.has(z.k));
      if (y) used.add(y.k);
      rows.push(`<div class="mk-row2">${oddCell(x.k, odds[x.k], dirs[x.k])}${y ? oddCell(y.k, odds[y.k], dirs[y.k]) : '<div></div>'}</div>`);
    });
    f2.filter(z => !used.has(z.k)).forEach(z => rows.push(`<div class="mk-row2"><div></div>${oddCell(z.k, odds[z.k], dirs[z.k])}</div>`));
    out.push({ title:'Фора', html: rows.join('') });
  }
  const tk = Object.keys(tot).sort((x, y) => (tot[x].n ?? 0) - (tot[y].n ?? 0));
  if (tk.length) out.push({ title:'Тотал', html: tk.map(key => {
    const t = tot[key];
    return `<div class="mk-tot"><span class="par">${esc(key)}</span>${t['ТБ'] ? oddCell('Больше', odds[t['ТБ']], dirs[t['ТБ']]) : '<div></div>'}${t['ТМ'] ? oddCell('Меньше', odds[t['ТМ']], dirs[t['ТМ']]) : '<div></div>'}</div>`;
  }).join('') });
  return out;
}

/* Сворачиваемый блок рынка (как в Fonbet). def=true — по умолчанию свёрнут */
function mkBlock(key, title, html, def){
  const closed = def !== toggledMk.has(key);
  return `<div class="mk"><div class="mk-head" data-mk="${esc(key)}"><span>${esc(title)}</span><span>${closed ? '▸' : '▾'}</span></div><div class="mk-body ${closed ? 'shut' : ''}">${html}</div></div>`;
}

function renderDetails(m){
  let h = '';
  currentPicks = pickMap(m);
  const groups = marketTables(m.odds, m.oddsDir);
  currentPicks = {};
  groups.forEach(g => h += mkBlock(m.id + '|' + g.title, g.title, g.html, false));
  if (!groups.length) h += `<div class="log"><span class="t">Основные коэффициенты закрыты</span></div>`;

  m.subs.forEach((sb, i) => {
    const sg = marketTables(sb.odds, {});
    const body = sg.length ? sg.map(g => `<div class="mk-sub">${esc(g.title)}</div>${g.html}`).join('') : '<span class="log t">Нет коэффициентов</span>';
    h += mkBlock(m.id + '|s' + i, sb.name + (sb.score ? ` (${sb.score})` : ''), body, false);
  });

  if (m.extra.length) h += mkBlock(m.id + '|extra', `Другие рынки (${Math.min(40, m.extra.length)})`, `<div class="chips">` + m.extra.slice(0, 40).map(e => chip(e.label, e.v)).join('') + `</div>`, true);

  const meta = [
    ['Спорт', m.sport], ['Турнир', m.league],
    ['Статус', m.status === 'live' ? 'Идёт сейчас' : m.status === 'upcoming' ? 'Ещё не начался' : 'Завершён'],
    ['Начало', m.start ? fmtStart(m) : '—'],
    m.status === 'live' ? ['Время', `<span class="timer-full" data-id="${esc(m.id)}">${esc(fmtTimer(m, true))}</span>`] : null,
    ['Счёт', esc(m.score) + (m.comment ? ` · ${esc(m.comment)}` : '')],
    ['ID', esc(m.id)]
  ].filter(Boolean);
  h += mkBlock(m.id + '|info', 'Информация', `<div class="d-meta">` + meta.map(([k, v]) => `<span>${esc(k)}</span><span>${k === 'Время' || k === 'Счёт' ? v : esc(v)}</span>`).join('') + `</div>`, true);

  const log = matchLog[m.id] || [];
  h += mkBlock(m.id + '|log', 'История за сессию', `<div class="log">` + (log.length ? log.slice().reverse().map(l => `<span class="t">${clock(l.t)}</span> ${esc(l.text)}`).join('<br>') : '<span class="t">Изменений пока не было</span>') + `</div>`, true);

  return aiBox(m) + h;
}

function openOnly(card){
  document.querySelectorAll('.details.open').forEach(d => d.classList.remove('open'));
  expanded.clear(); expanded.add(String(card.dataset.id));
  card.querySelector('.details').classList.add('open');
}

function onContainerClick(e){
  const act = e.target.closest('[data-act]');
  if (act){
    if (act.dataset.act === 'more'){ const k = act.dataset.sport; sportLimit[k] = (sportLimit[k] || 40) + 40; renderMatches(); return; }
    if (act.dataset.act === 'analyze' || act.dataset.act === 'reanalyze'){
      const card = e.target.closest('.match-card');
      if (card){ openOnly(card); analyzeSingleMatch(card.dataset.id, act.dataset.act === 'reanalyze'); }
      return;
    }
  }
  const mh = e.target.closest('.mk-head');
  if (mh){
    const k = mh.dataset.mk;
    if (toggledMk.has(k)) toggledMk.delete(k); else toggledMk.add(k);
    const body = mh.nextElementSibling; body.classList.toggle('shut');
    mh.lastElementChild.textContent = body.classList.contains('shut') ? '▸' : '▾';
    return;
  }
  const sh = e.target.closest('.sport-head');
  if (sh){
    if (!sportsTouched){ sportsTouched = true; openSports.clear(); if (lastAutoOpen) openSports.add(lastAutoOpen); }
    const k = sh.dataset.sport;
    if (openSports.has(k)) openSports.delete(k); else openSports.add(k);
    renderMatches(); return;
  }
  const lh = e.target.closest('.league-head');
  if (lh){
    const k = lh.dataset.lg;
    if (closedLeagues.has(k)) closedLeagues.delete(k); else closedLeagues.add(k);
    renderMatches(); return;
  }
  const head = e.target.closest('.match-head');
  if (head){
    const card = head.closest('.match-card');
    if (expanded.has(String(card.dataset.id))){ expanded.clear(); card.querySelector('.details').classList.remove('open'); }
    else { openOnly(card); card.scrollIntoView({ block:'nearest', behavior:'smooth' }); }
  }
}

/* Раз в секунду: таймеры матчей и обратный отсчёт обновления */
function tick(){
  document.querySelectorAll('.live-timer').forEach(el => { const m = matchById[el.dataset.id]; if (m) el.textContent = fmtTimer(m, false); });
  document.querySelectorAll('.timer-full').forEach(el => { const m = matchById[el.dataset.id]; if (m) el.textContent = fmtTimer(m, true); });
  setSync();
}

/* ================= Gemini: ключ и модели ================= */
async function loadModels(){
  const key = $('geminiKey').value.trim();
  const st = $('keyStatus');
  if (!key){ st.className = 'key-status bad'; st.textContent = 'Ключ не введён'; return; }
  st.className = 'key-status'; st.textContent = '⏳ Проверяю ключ...';
  try {
    const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200', { headers: { 'x-goog-api-key': key } });
    const d = await r.json();
    if (d.error){ st.className = 'key-status bad'; st.textContent = '❌ Ключ не подошёл: ' + d.error.message; return; }
    const models = (d.models || [])
      .filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
      .map(m => m.name.replace('models/', ''))
      .filter(n => n.startsWith('gemini') && !/embedding|tts|image|live|audio|robotics/.test(n));
    if (!models.length){ st.className = 'key-status bad'; st.textContent = '⚠️ Ключ принят, но подходящих моделей нет'; return; }
    models.sort((a, b) => (b.includes('flash') - a.includes('flash')) || b.localeCompare(a));
    const sel = $('modelSelect');
    sel.innerHTML = models.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('');
    const saved = localStorage.getItem('fb_model');
    if (saved && models.includes(saved)) sel.value = saved;
    saveConfig();
    st.className = 'key-status ok'; st.textContent = `✅ Ключ рабочий. Доступно моделей: ${models.length}`;
  } catch (e){
    st.className = 'key-status bad'; st.textContent = '❌ Нет связи с Google: ' + e.message + ' (попробуйте VPN)';
  }
}

async function geminiRequest(promptText, asJson){
  const apiKey = $('geminiKey').value.trim(), model = $('modelSelect').value;
  if (!apiKey) throw new Error('⚠️ Вставьте ключ Gemini API.');
  if (!model) throw new Error('⚠️ Сначала нажмите «Проверить ключ» и выберите модель.');
  const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), 60000);
  try {
    const body = { contents: [{ parts: [{ text: promptText }] }] };
    if (asJson) body.generationConfig = { responseMimeType: 'application/json' };
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'x-goog-api-key': apiKey }, body: JSON.stringify(body), signal: ctrl.signal
    });
    const data = await r.json();
    if (data.error) throw new Error(`❌ Ошибка API (${model}): ${data.error.message}`);
    const cand = data.candidates && data.candidates[0];
    const text = cand && cand.content && cand.content.parts && cand.content.parts.map(p => p.text || '').join('');
    if (!text) throw new Error('⚠️ Пустой ответ. ' + (data.promptFeedback && data.promptFeedback.blockReason ? 'Запрос заблокирован: ' + data.promptFeedback.blockReason : ''));
    return text;
  } catch (err){
    if (err.name === 'AbortError') throw new Error('⏳ Таймаут 60 секунд. Попробуйте другую модель или VPN.');
    if (err instanceof TypeError) throw new Error('❌ Ошибка сети: ' + err.message + '. Проверьте интернет или VPN.');
    throw err;
  } finally { clearTimeout(timer); }
}

async function callGemini(promptText){
  const out = $('aiOutput');
  out.textContent = '⏳ Отправка запроса...';
  window.scrollTo({ top: 0, behavior: 'smooth' });
  try { out.textContent = await geminiRequest(promptText, false); } catch (err){ out.textContent = err.message; }
}

const RISK = { low:'🟢 Надёжная', medium:'🟡 Средний риск', high:'🔴 Рискованная' };
function parseBets(raw){
  try { const t = raw.replace(/```json|```/g, '').trim(); return JSON.parse(t.slice(t.indexOf('{'), t.lastIndexOf('}') + 1)); } catch (e){ return null; }
}
function pickMap(m){
  const r = aiResults[m.id], map = {};
  if (r && r.state === 'done' && r.data && Array.isArray(r.data.bets)) r.data.bets.forEach(b => { if (b && b.market) map[b.market] = ['low', 'medium', 'high'].includes(b.risk) ? b.risk : 'medium'; });
  return map;
}
function aiButton(m){
  const r = aiResults[m.id];
  const label = !r ? '⚡ AI Анализ матча' : r.state === 'loading' ? '⏳ Анализ...' : r.state === 'done' ? '🤖 Прогноз готов — показать' : '⚠️ Ошибка — повторить';
  return `<button class="btn-analyze-match" data-act="analyze"${r && r.state === 'loading' ? ' disabled' : ''}>${label}</button>`;
}
function aiBox(m){
  const r = aiResults[m.id];
  if (!r) return '';
  if (r.state === 'loading') return `<div class="ai-box"><div class="log">⏳ Gemini анализирует матч...</div></div>`;
  if (r.state === 'error') return `<div class="ai-box"><div class="bad">${esc(r.text)}</div><button class="btn-more" data-act="reanalyze">🔄 Повторить</button></div>`;
  const d = r.data;
  let h = `<div class="ai-box"><div class="ai-legend">🟢 надёжная · 🟡 средний риск · 🔴 рискованная (подсвечены и в таблицах коэффициентов)</div>`;
  if (d && d.summary) h += `<div class="ai-sum">${esc(d.summary)}</div>`;
  if (d && Array.isArray(d.bets) && d.bets.length){
    d.bets.forEach(b => {
      const risk = ['low', 'medium', 'high'].includes(b.risk) ? b.risk : 'medium';
      const odd = m.odds[b.market] !== undefined ? m.odds[b.market] : b.odds;
      h += `<div class="bet ${risk}"><div class="bet-top"><b>${esc(b.market || '')}</b><span class="bet-odd">${odd !== undefined && odd !== null ? 'кэф ' + esc(odd) : ''}</span><span class="bet-risk">${RISK[risk]}</span></div><div class="bet-why">${esc(b.reason || '')}</div></div>`;
    });
  } else h += `<div class="log">${esc(r.raw || '')}</div>`;
  h += `<div class="ai-foot">Разбор при счёте ${esc(r.score)} в ${clock(r.at)}${r.score !== m.score ? ' · <span class="bad">счёт изменился, пересчитайте</span>' : ''}. ИИ не знает исход матча, это разбор коэффициентов, а не гарантия.</div><button class="btn-more" data-act="reanalyze">🔄 Пересчитать</button></div>`;
  return h;
}

async function analyzeSingleMatch(id, force){
  const m = matchById[id]; if (!m) return;
  const cur = aiResults[id];
  if (cur && (cur.state === 'loading' || (cur.state === 'done' && !force))) return;
  aiResults[id] = { state:'loading' }; renderMatches();
  const subs = m.subs.map(sb => `${sb.name}${sb.score ? ' (' + sb.score + ')' : ''}: ${JSON.stringify(sb.odds)}`).join('\n');
  const log = (matchLog[m.id] || []).map(l => `${clock(l.t)} ${l.text}`).join('\n');
  const prompt = `Проанализируй матч.\nТурнир: ${m.league}\nСпорт: ${m.sport}\nМатч: ${m.team1} — ${m.team2}\nСтатус: ${m.status}\nСчет: ${m.score} (${fmtTimer(m, true)})\nКоэффициенты: ${JSON.stringify(m.odds)}\n${subs ? 'Доп. рынки:\n' + subs + '\n' : ''}${log ? 'События:\n' + log + '\n' : ''}\nОтветь ТОЛЬКО JSON без пояснений: {"summary":"1-2 предложения о ситуации в матче","bets":[{"market":"точное название из списка коэффициентов, например П1 или ТБ(2.5)","odds":число,"risk":"low|medium|high","reason":"кратко почему"}]}. Дай от 1 до 3 ставок. risk: low — надёжная, medium — средний риск, high — рискованная. Русский язык.`;
  try {
    const raw = await geminiRequest(prompt, true);
    aiResults[id] = { state:'done', raw, data: parseBets(raw), at: Date.now(), score: m.score };
  } catch (err){ aiResults[id] = { state:'error', text: err.message }; }
  renderMatches();
}

function analyzeTopLine(){
  const live = parsedMatches.filter(m => m.status === 'live' && Object.keys(m.odds).length > 0).slice(0, 15);
  if (!live.length){ alert('Нет матчей в лайве.'); return; }
  const summary = live.map(m => `- [${m.league}] ${m.team1} vs ${m.team2} (${m.score}, ${fmtTimer(m, false)}) кэфы: ${JSON.stringify(m.odds)}`).join('\n');
  callGemini(`Выбери топ-3 ставки из лайвов:\n${summary}`);
}
