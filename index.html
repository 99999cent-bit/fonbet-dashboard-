<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FONBET // AI PREDICTOR PRO</title>
    <style>
        :root {
            --bg: #0f1215;
            --card: #181c22;
            --card-hover: #20262e;
            --border: #2a313c;
            --accent: #00e676;
            --red: #ff3d57;
            --blue: #2979ff;
            --text: #eceff1;
            --muted: #8b96a5;
            --odd-bg: #252b34;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 12px; max-width: 900px; margin: 0 auto; }
        
        /* Шапка */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: var(--card); border-radius: 10px; border: 1px solid var(--border); margin-bottom: 12px; }
        .logo { font-size: 18px; font-weight: 800; color: var(--accent); letter-spacing: 0.5px; }
        .logo span { color: var(--red); }
        .btn-refresh { background: var(--accent); color: #000; border: none; padding: 8px 14px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 13px; }
        .btn-refresh:active { transform: scale(0.97); }

        /* Настройки */
        .config-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: var(--card); padding: 12px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 12px; }
        @media (max-width: 600px) { .config-panel { grid-template-columns: 1fr; } }
        .input-group label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; }
        .input-group input { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px 10px; border-radius: 6px; font-size: 13px; }

        /* Фильтры */
        .filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 10px; }
        .filter-btn { background: var(--card); color: var(--muted); border: 1px solid var(--border); padding: 7px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
        .filter-btn.active { background: var(--red); color: #fff; border-color: var(--red); }
        .search-box { width: 100%; background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 9px 12px; border-radius: 8px; margin-bottom: 12px; font-size: 13px; }

        /* Блок ИИ-Анализа */
        .ai-panel { background: linear-gradient(145deg, #16202a, #191d24); border: 1px solid var(--accent); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
        .ai-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .ai-title { font-size: 15px; font-weight: 700; color: var(--accent); }
        .ai-content { font-size: 13.5px; line-height: 1.5; color: #dfe6ed; white-space: pre-wrap; }
        .btn-ai-all { width: 100%; background: var(--accent); color: #000; border: none; padding: 10px; border-radius: 7px; font-weight: 800; cursor: pointer; margin-top: 8px; font-size: 14px; }

        /* Карточки матчей как в Фонбете */
        .league-header { background: #1e242d; color: var(--muted); font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 6px; margin: 12px 0 6px 0; text-transform: uppercase; letter-spacing: 0.4px; }
        .match-card { background: var(--card); border: 1px solid var(--border); border-radius: 9px; padding: 12px; margin-bottom: 8px; transition: 0.15s; }
        .match-card:hover { border-color: #3e4856; }
        
        .match-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 12px; }
        .live-badge { background: rgba(255, 61, 87, 0.15); color: var(--red); padding: 2px 7px; border-radius: 4px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }
        .live-dot { width: 6px; height: 6px; background: var(--red); border-radius: 50%; animation: blink 1.2s infinite; }
        @keyframes blink { 50% { opacity: 0.2; } }

        .teams-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .teams-names { font-size: 15px; font-weight: 700; line-height: 1.35; }
        .score-box { background: #101418; border: 1px solid var(--border); padding: 6px 12px; border-radius: 6px; text-align: right; min-width: 75px; }
        .score-main { font-size: 17px; font-weight: 800; color: var(--accent); }
        .score-sub { font-size: 11px; color: var(--muted); }

        /* Сетка коэффициентов */
        .odds-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(72px, 1fr)); gap: 6px; margin-bottom: 8px; }
        .odd-btn { background: var(--odd-bg); border: 1px solid #323a46; border-radius: 6px; padding: 6px 8px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; cursor: pointer; }
        .odd-btn:hover { border-color: var(--accent); }
        .odd-label { color: var(--muted); font-weight: 500; }
        .odd-val { color: #fff; font-weight: 700; }

        /* Под-события (Угловые, ЖК и т.д.) */
        .submarkets { font-size: 11.5px; color: var(--muted); margin-bottom: 8px; padding-top: 6px; border-top: 1px dashed var(--border); }
        .submarket-item { display: inline-block; background: #13171c; padding: 3px 8px; border-radius: 4px; margin: 2px 4px 2px 0; border: 1px solid #262c36; }

        .btn-analyze-match { width: 100%; background: rgba(0, 230, 118, 0.12); color: var(--accent); border: 1px solid var(--accent); padding: 7px; border-radius: 6px; font-weight: 700; font-size: 12.5px; cursor: pointer; }
        .btn-analyze-match:hover { background: var(--accent); color: #000; }
        .status-msg { color: var(--muted); font-size: 13px; text-align: center; padding: 20px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo"><span>FONBET</span> // AI PREDICTOR</div>
        <button class="btn-refresh" onclick="loadOdds()">🔄 Обновить линию</button>
    </div>

    <div class="config-panel">
        <div class="input-group">
            <label>Ссылка на бэкенд Railway:</label>
            <input type="text" id="backendUrl" value="https://fonbet-dashboard-production.up.railway.app" onchange="saveConfig()">
        </div>
        <div class="input-group">
            <label>Ключ Gemini API:</label>
            <input type="password" id="geminiKey" placeholder="Вставьте ваш ключ AIzaSy..." onchange="saveConfig()">
        </div>
    </div>

    <div class="ai-panel">
        <div class="ai-header">
            <div class="ai-title">🤖 Рекомендации и Разбор Gemini AI</div>
        </div>
        <div class="ai-content" id="aiOutput">Выберите любой матч ниже и нажмите «⚡ AI Анализ матча», либо нажмите кнопку ниже, чтобы ИИ сам просканировал всю линию и выбрал 3 лучшие ставки прямо сейчас.</div>
        <button class="btn-ai-all" onclick="analyzeTopLine()">🔥 Найти 3 лучшие ставки из всей Лайв-линии</button>
    </div>

    <div class="filters">
        <button class="filter-btn active" onclick="setSportFilter('all', this)">Все матчи</button>
        <button class="filter-btn" onclick="setSportFilter('футбол', this)">⚽ Футбол</button>
        <button class="filter-btn" onclick="setSportFilter('хоккей', this)">🏒 Хоккей</button>
        <button class="filter-btn" onclick="setSportFilter('теннис', this)">🎾 Теннис</button>
        <button class="filter-btn" onclick="setSportFilter('баскетбол', this)">🏀 Баскетбол</button>
        <button class="filter-btn" onclick="setSportFilter('киберспорт', this)">🎮 Киберспорт</button>
    </div>

    <input type="text" class="search-box" id="searchInput" placeholder="🔍 Поиск по командам или лиге (например: Урава, Кобе, КХЛ, BLAST)..." oninput="renderMatches()">

    <div id="matchesContainer">
        <div class="status-msg">Загрузка матчей с сервера...</div>
    </div>

<script>
    let parsedMatches = [];
    let currentSport = 'all';

    // Загрузка сохраненных настроек
    window.onload = () => {
        if (localStorage.getItem('fb_backend')) document.getElementById('backendUrl').value = localStorage.getItem('fb_backend');
        if (localStorage.getItem('fb_gemini')) document.getElementById('geminiKey').value = localStorage.getItem('fb_gemini');
        loadOdds();
        setInterval(loadOdds, 20000); // Автообновление каждые 20 сек
    };

    function saveConfig() {
        localStorage.setItem('fb_backend', document.getElementById('backendUrl').value.trim());
        localStorage.setItem('fb_gemini', document.getElementById('geminiKey').value.trim());
    }

    function setSportFilter(sport, btn) {
        currentSport = sport;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderMatches();
    }

    // Расшифровка кодов коэффициентов Фонбета
    function parseMatchOdds(factorsArray) {
        const odds = {};
        if (!factorsArray) return odds;
        
        for (const f of factorsArray) {
            const id = f.f;
            const val = f.v;
            const param = f.pt || (f.p ? (f.p / 100) : '');

            if (id === 921) odds['П1'] = val;
            else if (id === 922) odds['X'] = val;
            else if (id === 923) odds['П2'] = val;
            else if (id === 924) odds['1X'] = val;
            else if (id === 925) odds['12'] = val;
            else if (id === 926) odds['X2'] = val;
            else if (id === 927 || id === 937 || id === 1845) odds[`Ф1(${param})`] = val;
            else if (id === 928 || id === 938 || id === 1846) odds[`Ф2(${param})`] = val;
            else if (id === 930 || id === 940 || id === 1848) odds[`ТБ(${param})`] = val;
            else if (id === 931 || id === 941 || id === 1849) odds[`ТМ(${param})`] = val;
        }
        return odds;
    }

    async function loadOdds() {
        const baseUrl = document.getElementById('backendUrl').value.trim().replace(/\/$/, '');
        const container = document.getElementById('matchesContainer');

        try {
            const res = await fetch(`${baseUrl}/api/live-odds`);
            const data = await res.json();

            if (!data.events || !Array.isArray(data.events)) {
                container.innerHTML = `<div class="status-msg">${data.error || 'Ожидание загрузки линии...'}</div>`;
                return;
            }

            // 1. Собираем справочник лиг и видов спорта (sports)
            const sportsMap = {};
            if (Array.isArray(data.sports)) {
                data.sports.forEach(s => { sportsMap[s.id] = s; });
            }

            // 2. Собираем справочник счета и времени (eventMiscs)
            const miscMap = {};
            if (Array.isArray(data.eventMiscs)) {
                data.eventMiscs.forEach(m => { miscMap[m.id] = m; });
            }

            // 3. Собираем справочник коэффициентов (customFactors)
            const factorsMap = {};
            if (Array.isArray(data.customFactors)) {
                data.customFactors.forEach(cf => {
                    if (cf.e && Array.isArray(cf.factors)) {
                        factorsMap[cf.e] = cf.factors;
                    } else if (cf.e && cf.f) {
                        if (!factorsMap[cf.e]) factorsMap[cf.e] = [];
                        factorsMap[cf.e].push(cf);
                    }
                });
            }

            // 4. Группируем под-события (угловые, ЖК, 1-й тайм) к главному матчу
            const subEventsMap = {};
            data.events.forEach(ev => {
                if (ev.level > 1 && ev.parentId) {
                    if (!subEventsMap[ev.parentId]) subEventsMap[ev.parentId] = [];
                    subEventsMap[ev.parentId].push(ev);
                }
            });

            // 5. Формируем чистый список главных матчей (level === 1 с командами)
            parsedMatches = [];
            data.events.forEach(ev => {
                if (ev.level === 1 && (ev.team1 || ev.team2)) {
                    const sportObj = sportsMap[ev.sportId] || {};
                    const parentSportObj = sportObj.parentId ? (sportsMap[sportObj.parentId] || {}) : sportObj;
                    
                    const leagueName = sportObj.name || 'Лига';
                    const rootSportName = (parentSportObj.name || leagueName).toLowerCase();

                    const misc = miscMap[ev.id] || {};
                    const score1 = misc.score1 !== undefined ? misc.score1 : 0;
                    const score2 = misc.score2 !== undefined ? misc.score2 : 0;
                    const timer = misc.timerSeconds ? `${Math.floor(misc.timerSeconds / 60)}'` : (misc.comment || 'LIVE');

                    const mainOdds = parseMatchOdds(factorsMap[ev.id]);

                    // Подтягиваем статистику под-событий (угловые, ЖК и т.д.)
                    const subs = [];
                    if (subEventsMap[ev.id]) {
                        subEventsMap[ev.id].forEach(sub => {
                            const subMisc = miscMap[sub.id];
                            const subScore = (subMisc && subMisc.score1 !== undefined) ? ` (${subMisc.score1}:${subMisc.score2})` : '';
                            const subOdds = parseMatchOdds(factorsMap[sub.id]);
                            const subOddsStr = Object.entries(subOdds).slice(0, 2).map(([k,v]) => `${k}: ${v}`).join(' ');
                            if (sub.name) {
                                subs.push(`${sub.name}${subScore}${subOddsStr ? ' [' + subOddsStr + ']' : ''}`);
                            }
                        });
                    }

                    parsedMatches.push({
                        id: ev.id,
                        team1: ev.team1 || 'Команда 1',
                        team2: ev.team2 || 'Команда 2',
                        league: leagueName,
                        sportCategory: rootSportName,
                        score: `${score1} : ${score2}`,
                        timer: timer,
                        comment: misc.comment || '',
                        odds: mainOdds,
                        subs: subs
                    });
                }
            });

            renderMatches();

        } catch (err) {
            container.innerHTML = `<div class="status-msg">Ошибка связи с бэкендом: ${err.message}</div>`;
        }
    }

    function renderMatches() {
        const container = document.getElementById('matchesContainer');
        const query = document.getElementById('searchInput').value.trim().toLowerCase();

        const filtered = parsedMatches.filter(m => {
            const matchSport = currentSport === 'all' || m.sportCategory.includes(currentSport) || m.league.toLowerCase().includes(currentSport);
            const matchSearch = !query || m.team1.toLowerCase().includes(query) || m.team2.toLowerCase().includes(query) || m.league.toLowerCase().includes(query);
            return matchSport && matchSearch;
        });

        if (filtered.length === 0) {
            container.innerHTML = `<div class="status-msg">Матчей по выбранному фильтру не найдено (Всего в лайве: ${parsedMatches.length})</div>`;
            return;
        }

        // Ограничиваем отрисовку первыми 80 матчами для скорости интерфейса
        let html = `<div style="font-size:12px; color:var(--muted); margin-bottom:8px;">Найдено реальных матчей в лайве: <b>${filtered.length}</b></div>`;
        let lastLeague = '';

        filtered.slice(0, 80).forEach(m => {
            if (m.league !== lastLeague) {
                html += `<div class="league-header">${m.league}</div>`;
                lastLeague = m.league;
            }

            const oddsEntries = Object.entries(m.odds);
            let oddsHtml = '';
            if (oddsEntries.length > 0) {
                oddsHtml = `<div class="odds-grid">` + oddsEntries.map(([k, v]) => `
                    <div class="odd-btn">
                        <span class="odd-label">${k}</span>
                        <span class="odd-val">${v}</span>
                    </div>
                `).join('') + `</div>`;
            } else {
                oddsHtml = `<div style="font-size:11px; color:var(--muted); margin-bottom:8px;">Прием ставок на основные исходы временно приостановлен</div>`;
            }

            let subsHtml = '';
            if (m.subs.length > 0) {
                subsHtml = `<div class="submarkets">` + m.subs.slice(0, 6).map(s => `<span class="submarket-item">${s}</span>`).join('') + `</div>`;
            }

            const matchDataEncoded = encodeURIComponent(JSON.stringify(m));

            html += `
                <div class="match-card">
                    <div class="match-top">
                        <span class="live-badge"><span class="live-dot"></span> ${m.timer}</span>
                        <span style="color:var(--muted)">ID: ${m.id}</span>
                    </div>
                    <div class="teams-row">
                        <div class="teams-names">
                            <div>${m.team1}</div>
                            <div>${m.team2}</div>
                        </div>
                        <div class="score-box">
                            <div class="score-main">${m.score}</div>
                            <div class="score-sub">${m.comment}</div>
                        </div>
                    </div>
                    ${oddsHtml}
                    ${subsHtml}
                    <button class="btn-analyze-match" onclick="analyzeSingleMatch('${matchDataEncoded}')">⚡ AI Анализ матча (Что ставить?)</button>
                </div>
            `;
        });

        container.innerHTML = html;
    }

    async function callGemini(promptText) {
        const apiKey = document.getElementById('geminiKey').value.trim();
        const output = document.getElementById('aiOutput');

        if (!apiKey) {
            output.innerHTML = '⚠️ Пожалуйста, вставьте ваш <b>Ключ Gemini API</b> в верхнее поле!';
            return;
        }

        output.innerHTML = '⏳ <b>Gemini AI изучает коэффициенты, счет и динамику матча...</b>';
        window.scrollTo({ top: 0, behavior: 'smooth' });

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: promptText }] }]
                })
            });

            const data = await response.json();
            if (data.error) {
                output.innerHTML = `❌ Ошибка API Gemini: ${data.error.message}`;
                return;
            }

            const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || 'Нет ответа от модели.';
            output.innerHTML = reply;
        } catch (err) {
            output.innerHTML = `❌ Ошибка запроса к Gemini: ${err.message}`;
        }
    }

    function analyzeSingleMatch(encodedMatch) {
        const m = JSON.parse(decodeURIComponent(encodedMatch));
        const prompt = `Ты — профессиональный спортивный аналитик по Live-ставкам в БК Фонбет.
Разбери текущий лайв-матч и дай четкую рекомендацию, что лучше поставить прямо сейчас:

Турнир: ${m.league}
Матч: ${m.team1} — ${m.team2}
Текущий счет: ${m.score} (Время/Статус: ${m.timer}, ${m.comment})
Текущие коэффициенты: ${JSON.stringify(m.odds)}
Дополнительная статистика и рынки (угловые, ЖК, таймы): ${m.subs.join('; ')}

Выдай ответ строго по структуре:
1. КРАТКАЯ ОЦЕНКА СИТУАЦИИ (что происходит на поле судя по счету, времени и котировкам).
2. ОСНОВНАЯ СТАВКА (надежный вариант с низким/средним риском и текущим кэфом).
3. ВАРИАНТ С ПОВЫШЕННЫМ КЭФОМ (тотал, фора или статистика).
4. СТЕПЕНЬ РИСКА (из 10) и рекомендуемый процент от банка.`;

        callGemini(prompt);
    }

    function analyzeTopLine() {
        const matchesWithOdds = parsedMatches.filter(m => Object.keys(m.odds).length > 0).slice(0, 25);
        if (matchesWithOdds.length === 0) {
            alert('Сначала дождитесь загрузки матчей с коэффициентами!');
            return;
        }

        const summary = matchesWithOdds.map(m => 
            `- [${m.league}] ${m.team1} vs ${m.team2} | Счет: ${m.score} (${m.timer}) | Кэфы: ${JSON.stringify(m.odds)} | Стат: ${m.subs.slice(0,2).join(', ')}`
        ).join('\n');

        const prompt = `Ты — профессиональный спортивный каппер. Перед тобой список текущих Live-матчей из линии Фонбета с реальными счетами и коэффициентами:

${summary}

Выбери из этого списка 3 САМЫХ ВЫГОДНЫХ И НАДЕЖНЫХ матча для ставки прямо сейчас (исключи мусорные/товарищеские игры с непредсказуемым исходом).
Для каждого из 3 выбранных матчей напиши:
1. Название матча и текущий счет.
2. Точную ставку (например: ТБ, Фора, Победа или ИТБ) и коэффициент.
3. Короткое и жесткое обоснование по счету и минуте матча.
В конце собери из них аккуратный мини-экспресс или дай совет по распределению банка.`;

        callGemini(prompt);
    }
</script>

</body>
</html>
