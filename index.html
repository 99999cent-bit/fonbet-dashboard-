<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FONBET // AI PREDICTOR PRO</title>
    <style>
        :root {
            --bg: #0f1215;
            --card: #181c22;
            --card-hover: #20262e;
            --border: #2a313c;
            --accent: #00e676;
            --red: #ff3d57;
            --blue: #2979ff;
            --text: #eceff1;
            --muted: #8b96a5;
            --odd-bg: #252b34;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 12px; max-width: 900px; margin: 0 auto; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: var(--card); border-radius: 10px; border: 1px solid var(--border); margin-bottom: 12px; }
        .logo { font-size: 18px; font-weight: 800; color: var(--accent); letter-spacing: 0.5px; }
        .logo span { color: var(--red); }
        .btn-refresh { background: var(--accent); color: #000; border: none; padding: 8px 14px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 13px; }

        .config-panel { display: grid; grid-template-columns: 2fr 2fr 1.5fr; gap: 10px; background: var(--card); padding: 12px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 12px; }
        @media (max-width: 700px) { .config-panel { grid-template-columns: 1fr; } }
        .input-group label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; }
        .input-group input, .input-group select { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px 10px; border-radius: 6px; font-size: 13px; }

        .status-tabs { display: flex; gap: 6px; margin-bottom: 10px; background: var(--card); padding: 6px; border-radius: 8px; border: 1px solid var(--border); }
        .tab-btn { flex: 1; background: transparent; color: var(--muted); border: none; padding: 8px; border-radius: 6px; font-size: 12.5px; font-weight: 700; cursor: pointer; text-align: center; }
        .tab-btn.active { background: #252b34; color: var(--text); border: 1px solid var(--border); }
        .tab-btn.live.active { color: var(--red); border-color: rgba(255, 61, 87, 0.4); }
        .tab-btn.upcoming.active { color: var(--blue); border-color: rgba(41, 121, 255, 0.4); }
        .tab-btn.finished.active { color: var(--muted); border-color: var(--border); }

        .filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 10px; }
        .filter-btn { background: var(--card); color: var(--muted); border: 1px solid var(--border); padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
        .filter-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }
        .search-box { width: 100%; background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 9px 12px; border-radius: 8px; margin-bottom: 12px; font-size: 13px; }

        .ai-panel { background: linear-gradient(145deg, #16202a, #191d24); border: 1px solid var(--accent); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
        .ai-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .ai-title { font-size: 15px; font-weight: 700; color: var(--accent); }
        .ai-content { font-size: 13.5px; line-height: 1.5; color: #dfe6ed; white-space: pre-wrap; }
        .btn-ai-all { width: 100%; background: var(--accent); color: #000; border: none; padding: 10px; border-radius: 7px; font-weight: 800; cursor: pointer; margin-top: 8px; font-size: 14px; }

        .league-header { background: #1e242d; color: var(--muted); font-size: 11.5px; font-weight: 700; padding: 5px 10px; border-radius: 5px; margin: 12px 0 6px 0; text-transform: uppercase; }
        .match-card { background: var(--card); border: 1px solid var(--border); border-radius: 9px; padding: 12px; margin-bottom: 8px; }
        .match-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 12px; }
        .status-badge { padding: 2px 7px; border-radius: 4px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }
        .status-live { background: rgba(255, 61, 87, 0.15); color: var(--red); }
        .live-dot { width: 6px; height: 6px; background: var(--red); border-radius: 50%; animation: blink 1.2s infinite; }
        @keyframes blink { 50% { opacity: 0.2; } }
        .status-upcoming { background: rgba(41, 121, 255, 0.15); color: var(--blue); }
        .status-finished { background: rgba(139, 150, 165, 0.15); color: var(--muted); }

        .teams-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .teams-names { font-size: 14.5px; font-weight: 700; line-height: 1.35; }
        .score-box { background: #101418; border: 1px solid var(--border); padding: 5px 10px; border-radius: 6px; text-align: right; min-width: 65px; }
        .score-main { font-size: 16px; font-weight: 800; color: var(--accent); }
        .score-sub { font-size: 10.5px; color: var(--muted); }

        .odds-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(72px, 1fr)); gap: 6px; margin-bottom: 8px; }
        .odd-btn { background: var(--odd-bg); border: 1px solid #323a46; border-radius: 6px; padding: 5px 7px; display: flex; justify-content: space-between; align-items: center; font-size: 11.5px; }
        .odd-label { color: var(--muted); font-weight: 500; }
        .odd-val { color: #fff; font-weight: 700; }

        .submarkets { font-size: 11.5px; color: var(--muted); margin-bottom: 8px; padding-top: 6px; border-top: 1px dashed var(--border); }
        .submarket-item { display: inline-block; background: #13171c; padding: 3px 7px; border-radius: 4px; margin: 2px 4px 2px 0; border: 1px solid #262c36; }

        .btn-analyze-match { width: 100%; background: rgba(0, 230, 118, 0.12); color: var(--accent); border: 1px solid var(--accent); padding: 7px; border-radius: 6px; font-weight: 700; font-size: 12px; cursor: pointer; }
        .btn-analyze-match:hover { background: var(--accent); color: #000; }
        .status-msg { color: var(--muted); font-size: 13px; text-align: center; padding: 20px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo"><span>FONBET</span> // AI PREDICTOR</div>
        <button class="btn-refresh" onclick="loadOdds()">🔄 Обновить</button>
    </div>

    <div class="config-panel">
        <div class="input-group">
            <label>Ссылка на бэкенд Railway:</label>
            <input type="text" id="backendUrl" value="https://fonbet-dashboard-production.up.railway.app" onchange="saveConfig()">
        </div>
        <div class="input-group">
            <label>Ключ Gemini API:</label>
            <input type="password" id="geminiKey" placeholder="AIzaSy..." onchange="saveConfig()">
        </div>
        <div class="input-group">
            <label>Модель ИИ:</label>
            <select id="modelSelect" onchange="saveConfig()">
                <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
                <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
                <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
                <option value="gemini-3.8-flash">Gemini 3.8 Flash</option>
            </select>
        </div>
    </div>

    <div class="ai-panel">
        <div class="ai-header"><div class="ai-title">🤖 Анализ Gemini AI</div></div>
        <div class="ai-content" id="aiOutput">Выберите модель, вставьте ключ, выберите матч ниже и нажмите «⚡ AI Анализ матча».</div>
        <button class="btn-ai-all" onclick="analyzeTopLine()">🔥 Найти 3 лучшие ставки из Лайва</button>
    </div>

    <div class="status-tabs">
        <button class="tab-btn live active" onclick="setStatusTab('live', this)">🔴 Открытые (Лайв)</button>
        <button class="tab-btn upcoming" onclick="setStatusTab('upcoming', this)">📅 Будущие</button>
        <button class="tab-btn finished" onclick="setStatusTab('finished', this)">🏁 Закрытые</button>
    </div>

    <div class="filters">
        <button class="filter-btn active" onclick="setSportFilter('all', this)">Все</button>
        <button class="filter-btn" onclick="setSportFilter('футбол', this)">⚽ Футбол</button>
        <button class="filter-btn" onclick="setSportFilter('хоккей', this)">🏒 Хоккей</button>
        <button class="filter-btn" onclick="setSportFilter('теннис', this)">🎾 Теннис</button>
        <button class="filter-btn" onclick="setSportFilter('киберспорт', this)">🎮 Киберспорт</button>
    </div>

    <input type="text" class="search-box" id="searchInput" placeholder="🔍 Поиск матча..." oninput="renderMatches()">

    <div id="matchesContainer">
        <div class="status-msg">Загрузка...</div>
    </div>

<script>
    let parsedMatches = [];
    let currentSport = 'all';
    let currentStatusTab = 'live';

    window.onload = () => {
        if (localStorage.getItem('fb_backend')) document.getElementById('backendUrl').value = localStorage.getItem('fb_backend');
        if (localStorage.getItem('fb_gemini')) document.getElementById('geminiKey').value = localStorage.getItem('fb_gemini');
        if (localStorage.getItem('fb_model')) document.getElementById('modelSelect').value = localStorage.getItem('fb_model');
        loadOdds();
        setInterval(loadOdds, 25000);
    };

    function saveConfig() {
        localStorage.setItem('fb_backend', document.getElementById('backendUrl').value.trim());
        localStorage.setItem('fb_gemini', document.getElementById('geminiKey').value.trim());
        localStorage.setItem('fb_model', document.getElementById('modelSelect').value);
    }

    function setStatusTab(status, btn) {
        currentStatusTab = status;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderMatches();
    }

    function setSportFilter(sport, btn) {
        currentSport = sport;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderMatches();
    }

    function parseMatchOdds(factorsArray) {
        const odds = {};
        if (!factorsArray) return odds;
        for (const f of factorsArray) {
            const id = f.f;
            const val = f.v;
            const param = f.pt || (f.p ? (f.p / 100) : '');
            if (id === 921) odds['П1'] = val;
            else if (id === 922) odds['X'] = val;
            else if (id === 923) odds['П2'] = val;
            else if (id === 927 || id === 937) odds[`Ф1(${param})`] = val;
            else if (id === 928 || id === 938) odds[`Ф2(${param})`] = val;
            else if (id === 930 || id === 940) odds[`ТБ(${param})`] = val;
            else if (id === 931 || id === 941) odds[`ТМ(${param})`] = val;
        }
        return odds;
    }

    async function loadOdds() {
        const baseUrl = document.getElementById('backendUrl').value.trim().replace(/\/$/, '');
        const container = document.getElementById('matchesContainer');

        try {
            const res = await fetch(`${baseUrl}/api/live-odds`);
            const data = await res.json();

            if (!data.events || !Array.isArray(data.events)) {
                container.innerHTML = `<div class="status-msg">${data.error || 'Загрузка линии...'}</div>`;
                return;
            }

            const sportsMap = {};
            if (Array.isArray(data.sports)) data.sports.forEach(s => { sportsMap[s.id] = s; });

            const miscMap = {};
            if (Array.isArray(data.eventMiscs)) data.eventMiscs.forEach(m => { miscMap[m.id] = m; });

            const factorsMap = {};
            if (Array.isArray(data.customFactors)) {
                data.customFactors.forEach(cf => {
                    if (cf.e && Array.isArray(cf.factors)) factorsMap[cf.e] = cf.factors;
                    else if (cf.e && cf.f) {
                        if (!factorsMap[cf.e]) factorsMap[cf.e] = [];
                        factorsMap[cf.e].push(cf);
                    }
                });
            }

            const subEventsMap = {};
            data.events.forEach(ev => {
                if (ev.level > 1 && ev.parentId) {
                    if (!subEventsMap[ev.parentId]) subEventsMap[ev.parentId] = [];
                    subEventsMap[ev.parentId].push(ev);
                }
            });

            parsedMatches = [];
            const now = Math.floor(Date.now() / 1000);

            data.events.forEach(ev => {
                if (ev.level === 1 && (ev.team1 || ev.team2)) {
                    const sportObj = sportsMap[ev.sportId] || {};
                    const parentSportObj = sportObj.parentId ? (sportsMap[sportObj.parentId] || {}) : sportObj;
                    const leagueName = sportObj.name || 'Лига';
                    const rootSportName = (parentSportObj.name || leagueName).toLowerCase();

                    const misc = miscMap[ev.id] || {};
                    const score1 = misc.score1 !== undefined ? misc.score1 : 0;
                    const score2 = misc.score2 !== undefined ? misc.score2 : 0;
                    
                    let status = 'live';
                    let timeStr = misc.timerSeconds ? `${Math.floor(misc.timerSeconds / 60)}'` : (misc.comment || 'LIVE');

                    if (ev.beginTime && ev.beginTime > now + 60) {
                        status = 'upcoming';
                        const dateObj = new Date(ev.beginTime * 1000);
                        timeStr = dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + ' ' + dateObj.toLocaleDateString([], { month: 'short', day: 'numeric' });
                    } else if (misc.isFinished || (misc.comment && misc.comment.toLowerCase().includes('заверш'))) {
                        status = 'finished';
                        timeStr = 'Завершен';
                    }

                    const mainOdds = parseMatchOdds(factorsMap[ev.id]);
                    const subs = [];
                    if (subEventsMap[ev.id]) {
                        subEventsMap[ev.id].forEach(sub => {
                            const subMisc = miscMap[sub.id];
                            const subScore = (subMisc && subMisc.score1 !== undefined) ? ` (${subMisc.score1}:${subMisc.score2})` : '';
                            const subOdds = parseMatchOdds(factorsMap[sub.id]);
                            const subOddsStr = Object.entries(subOdds).slice(0, 2).map(([k,v]) => `${k}: ${v}`).join(' ');
                            if (sub.name) subs.push(`${sub.name}${subScore}${subOddsStr ? ' [' + subOddsStr + ']' : ''}`);
                        });
                    }

                    parsedMatches.push({
                        id: ev.id,
                        team1: ev.team1 || 'Команда 1',
                        team2: ev.team2 || 'Команда 2',
                        league: leagueName,
                        sportCategory: rootSportName,
                        score: `${score1} : ${score2}`,
                        timeStr: timeStr,
                        status: status,
                        comment: misc.comment || '',
                        odds: mainOdds,
                        subs: subs
                    });
                }
            });

            renderMatches();
        } catch (err) {
            container.innerHTML = `<div class="status-msg">Ошибка: ${err.message}</div>`;
        }
    }

    function renderMatches() {
        const container = document.getElementById('matchesContainer');
        const query = document.getElementById('searchInput').value.trim().toLowerCase();

        const filtered = parsedMatches.filter(m => {
            const matchStatus = m.status === currentStatusTab;
            const matchSport = currentSport === 'all' || m.sportCategory.includes(currentSport) || m.league.toLowerCase().includes(currentSport);
            const matchSearch = !query || m.team1.toLowerCase().includes(query) || m.team2.toLowerCase().includes(query) || m.league.toLowerCase().includes(query);
            return matchStatus && matchSport && matchSearch;
        });

        if (filtered.length === 0) {
            container.innerHTML = `<div class="status-msg">Матчей не найдено.</div>`;
            return;
        }

        let html = `<div style="font-size:12px; color:var(--muted); margin-bottom:8px;">Найдено: <b>${filtered.length}</b></div>`;
        let lastLeague = '';

        filtered.slice(0, 60).forEach(m => {
            if (m.league !== lastLeague) {
                html += `<div class="league-header">${m.league}</div>`;
                lastLeague = m.league;
            }

            const oddsEntries = Object.entries(m.odds);
            let oddsHtml = oddsEntries.length > 0 ? 
                `<div class="odds-grid">` + oddsEntries.map(([k, v]) => `
                    <div class="odd-btn"><span class="odd-label">${k}</span><span class="odd-val">${v}</span></div>
                `).join('') + `</div>` : `<div style="font-size:11px; color:var(--muted); margin-bottom:6px;">Коэффициенты закрыты</div>`;

            let badgeHtml = m.status === 'live' ? `<span class="status-badge status-live"><span class="live-dot"></span> ${m.timeStr}</span>` :
                            m.status === 'upcoming' ? `<span class="status-badge status-upcoming">📅 ${m.timeStr}</span>` :
                            `<span class="status-badge status-finished">🏁 ${m.timeStr}</span>`;

            let subsHtml = m.subs.length > 0 ? `<div class="submarkets">` + m.subs.slice(0, 4).map(s => `<span class="submarket-item">${s}</span>`).join('') + `</div>` : '';
            const matchDataEncoded = encodeURIComponent(JSON.stringify(m));

            html += `
                <div class="match-card">
                    <div class="match-top">${badgeHtml}<span style="color:var(--muted)">ID: ${m.id}</span></div>
                    <div class="teams-row">
                        <div class="teams-names"><div>${m.team1}</div><div>${m.team2}</div></div>
                        <div class="score-box"><div class="score-main">${m.score}</div><div class="score-sub">${m.comment}</div></div>
                    </div>
                    ${oddsHtml}
                    ${subsHtml}
                    <button class="btn-analyze-match" onclick="analyzeSingleMatch('${matchDataEncoded}')">⚡ AI Анализ матча</button>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    async function callGemini(promptText) {
        const apiKey = document.getElementById('geminiKey').value.trim();
        const selectedModel = document.getElementById('modelSelect').value;
        const output = document.getElementById('aiOutput');

        if (!apiKey) {
            output.innerHTML = '⚠️ Вставьте Ключ Gemini API!';
            return;
        }

        output.innerHTML = `⏳ <b>Отправка запроса модели ${selectedModel}...</b>`;
        window.scrollTo({ top: 0, behavior: 'smooth' });

        try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 20000); // Таймаут 20 секунд

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] }),
                signal: controller.signal
            });
            clearTimeout(timeoutId);

            const data = await response.json();
            if (data.error) {
                output.innerHTML = `❌ <b>Ошибка API (${selectedModel}):</b> ${data.error.message}<br><small>Попробуйте выбрать в выпадающем списке модель <b>Gemini 1.5 Flash</b>.</small>`;
                return;
            }
            output.innerHTML = data.candidates?.[0]?.content?.parts?.[0]?.text || 'Нет ответа от модели.';
        } catch (err) {
            if (err.name === 'AbortError') {
                output.innerHTML = `⏳ <b>Превышено время ожидания (таймаут).</b><br>Модель ${selectedModel} долго думает или перегружена. Попробуйте переключить модель на <b>Gemini 1.5 Flash</b> или выключить/включить VPN.`;
            } else {
                output.innerHTML = `❌ <b>Ошибка сети:</b> ${err.message}<br><small>Проверьте стабильность интернет-соединения или VPN.</small>`;
            }
        }
    }

    function analyzeSingleMatch(encodedMatch) {
        const m = JSON.parse(decodeURIComponent(encodedMatch));
        callGemini(`Проанализируй матч:\nТурнир: ${m.league}\nМатч: ${m.team1} — ${m.team2}\nСчет: ${m.score} (${m.timeStr})\nКэфы: ${JSON.stringify(m.odds)}\nДай ставку и прогноз.`);
    }

    function analyzeTopLine() {
        const live = parsedMatches.filter(m => m.status === 'live' && Object.keys(m.odds).length > 0).slice(0, 15);
        if (!live.length) { alert('Нет матчей.'); return; }
        const summary = live.map(m => `- [${m.league}] ${m.team1} vs ${m.team2} (${m.score})`).join('\n');
        callGemini(`Выбери топ-3 ставки из лайвов:\n${summary}`);
    }
</script>
</body>
</html>
